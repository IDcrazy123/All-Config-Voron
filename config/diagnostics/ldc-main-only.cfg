# Temporary LDC1612 isolation profile: Manta MCU only, no EBB boards.
# Use only after EBB0-4 are physically isolated with printer power off.
# No motion or heater outputs are configured; raw LDC frequency is available.

[printer]
kinematics: none
max_velocity: 350
max_accel: 7000

[mcu]
canbus_uuid: 19b203d75137
canbus_interface: can0

[probe_eddy_current ldc1612_eddy_coil]
sensor_type: ldc1612
i2c_mcu: mcu
i2c_bus: i2c3_PA8_PC9
i2c_address: 42
max_sensor_hz: 12000000
reg_drive_current: 19
x_offset: 0
y_offset: 35
descend_z: 0.5

[temperature_sensor ldc_coil_thermistor]
sensor_type: Generic 3950
sensor_pin: PC5
min_temp: 0
max_temp: 120

[temperature_sensor bed_thermistor]
sensor_type: NTC 100K MGB18-104F39050L32
sensor_pin: PB0
min_temp: 0
max_temp: 120
