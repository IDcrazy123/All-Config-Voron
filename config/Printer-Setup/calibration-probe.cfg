# ============================================================================
# CALIBRATION-PROBE.CFG - Bed probing and tool alignment
# Purpose: Configure LDC1612 Z homing/mesh and Axiscope tool calibration.
# Loading: Included once by printer.cfg after KTC has registered the tools.
# LDC1612 supplies the bed reference; the Axiscope camera measures tool XY.
# The removable PF2 switch provides preliminary relative Z; first layers finalize Z.
# Main commands: CALIBRATION_STATUS, CHECK_OFFSETS, CALIBRATE_MOVE_OVER_PROBE,
# and the attended CALIBRATE_COARSE_Z_OFFSETS CONFIRM=1 workflow.
# Local setup: Probe offsets, mesh bounds, sensor pin and switch/probe geometry.
# Keep the matching _CALIBRATION_SWITCH values in toolchanger-config.cfg aligned.
# Remove the PF2 holder before normal homing, leveling, mesh or printing.
# Final offsets are reviewed and persisted separately; legacy save macros are blocked.
# ============================================================================

# Sharing scope: LDC1612 + Axiscope workflow integration, measured reference.
# Requires installed LDC1612/Axiscope, Manta I2C, KTC, [respond],
# _CALIBRATION_SWITCH (currently in toolchanger-config.cfg) and crash wrappers.
# Do not copy this file if you use a different probing/calibration backend.
# Change coil offsets/mesh/probe pins in their native sections. The LDC1612
# requires its own drive-current, Z-height, and thermal-drift calibration.
# Axiscope switch geometry is duplicated in _CALIBRATION_SWITCH for reports and
# clearance moves: update BOTH owners together, not a global parameter block.
# The user-owned orchestration below adds clearance before the final T0 without
# patching Axiscope Python. Switch calibration still requires attendance.

#####################################################################
# LDC1612 on Manta M8P V2.0 I2C header
#####################################################################

[probe_eddy_current ldc1612_eddy_coil]
sensor_type: ldc1612
i2c_mcu: mcu
i2c_bus: i2c3_PA8_PC9
i2c_speed: 100000
i2c_address: 42
max_sensor_hz: 12000000
x_offset: 0
y_offset: 35
descend_z: 0.5
# X/Y match the previous mount. Verify against the new coil center.
# Drive current and the 100 C scan model are saved in printer.cfg.
# Use hardware I2C3 on the M8P pins. MCU timing faults occurred during
# supervised tap/rapid-scan runs on the previous software bus; cause unproven.
# Start at 100 kHz for the moving cable.

[temperature_probe ldc1612_eddy_coil]
sensor_type: Generic 3950
sensor_pin: PC5
horizontal_move_z: 2
calibration_bed_temp: 100

# Keep automatic printing disabled until the new probe is calibrated and its
# homing, QGL, mesh, and first layers have been verified on this machine.
[gcode_macro _LDC1612_PRODUCTION]
variable_verified: 0
gcode:
  # State only.

# Native Klipper tap uses nozzle contact to correct the Z frame after the
# inductive home/QGL. Run only after tap_threshold has been calibrated and
# verified with an attendant ready to stop a failed descent.
[gcode_macro LDC_TAP_HOME]
description: Establish the T0 nozzle Z reference with native Eddy tap
gcode:
  {% if printer.toolchanger.tool_number|int != 0 or printer.toolchanger.detected_tool_number|int != 0 %}
    {action_raise_error("LDC1612 tap requires T0 mounted and detected")}
  {% elif "xyz" not in printer.toolhead.homed_axes or not printer.quad_gantry_level.applied %}
    {action_raise_error("LDC1612 tap requires homed XYZ and applied QGL")}
  {% elif printer.configfile.settings["probe_eddy_current ldc1612_eddy_coil"].tap_threshold is not defined %}
    {action_raise_error("Calibrate and SAVE_CONFIG the LDC1612 tap_threshold first")}
  {% endif %}
  G90
  G0 Z10 F3000
  G0 X174 Y168 F6000
  PROBE METHOD=tap LIFT_SPEED=10 SAMPLES=3 SAMPLES_TOLERANCE=0.01 SAMPLES_TOLERANCE_RETRIES=2
  _LDC1612_APPLY_TAP_Z
  G0 Z10 F3000

[gcode_macro _LDC1612_APPLY_TAP_Z]
description: Correct the kinematic Z origin using the last native tap result
gcode:
  {% set contact_z = printer.probe.last_probe_position.z|float %}
  {% if contact_z|abs > 2.0 %}
    {action_raise_error("LDC1612 tap result is too far from the current Z origin")}
  {% endif %}
  SET_KINEMATIC_POSITION Z={printer.toolhead.position.z|float - contact_z}
  RESPOND MSG="LDC1612 tap corrected Z by {-contact_z|round(4)} mm"

#####################################################################
# Bed mesh - coordinates are probe coordinates, not nozzle coordinates
#####################################################################

[bed_mesh]
zero_reference_position: 174, 168
# Native scan pauses at each point; keep travel moderate on the five-tool gantry.
speed: 150
horizontal_move_z: 2
mesh_min: 20, 45
mesh_max: 320, 325
probe_count: 15, 15
adaptive_margin: 10
mesh_pps: 0,0

#####################################################################
# Axis-twist model
#####################################################################

# [axis_twist_compensation]
# Disabled in the loaded configuration; no axis-twist coefficients are saved.

#####################################################################
# Calibration backend status and read-only offset report
#####################################################################

[gcode_macro CALIBRATION_STATUS]
description: Report the active tool-offset calibration backend
gcode:
  {% set switch = printer["gcode_macro _CALIBRATION_SWITCH"] %}
  RESPOND MSG="Calibration ownership: Axiscope camera = XY; PF2 switch = coarse relative Z; first-layer print = final Z"
  RESPOND MSG="PF2 switch: X{switch.x} Y{switch.y}; T0 triggers near Z{switch.contact_z}; Axiscope starts at Z{switch.probe_z}"
  RESPOND MSG="LDC1612 on Manta I2C provides Z home and bed mesh after new calibration"
  RESPOND MSG="Axiscope automatic config writes are disabled; review every result before changing saved offsets"
  RESPOND MSG="Remove the front PF2 switch holder before G28, QGL, mesh, or printing"
  {% if printer.axiscope is defined %}
    RESPOND MSG="Axiscope Klipper backend active; use QUERY_ENDSTOPS to verify the switch before an attended coarse-Z run"
  {% else %}
    RESPOND TYPE=error MSG="Axiscope status object is unavailable"
  {% endif %}

[gcode_macro CHECK_OFFSETS]
description: Report XYZ offsets for every configured tool
gcode:
  _CHECK_OFFSETS

[gcode_macro _CHECK_OFFSETS]
description: Report XYZ offsets for every configured tool
gcode:
  RESPOND MSG="=== CONFIGURED TOOL XYZ OFFSETS ==="
  {% for tname in printer.toolchanger.tool_names %}
    {% set tool = printer[tname] %}
    RESPOND MSG="{tname}: X={tool.gcode_x_offset|float|round(4)} Y={tool.gcode_y_offset|float|round(4)} Z={tool.gcode_z_offset|float|round(4)}"
  {% endfor %}

[gcode_macro CALIBRATE_NOZZLE_PROBE_OFFSET]
description: Disabled legacy tool-probe command
gcode:
  {action_raise_error("No tool_probe_endstop is configured; LDC1612 is fixed to the shuttle.")}

[gcode_macro _SAVE_TOOL_OFFSET]
description: Disabled legacy KTC XYZ offset writer
gcode:
  {action_raise_error("Legacy tools_calibrate offset saving is disabled. Apply reviewed Axiscope XY results manually; finalize Z with first-layer tests.")}

[gcode_macro _SAVE_Z_TOOL_OFFSET]
description: Disabled legacy KTC Z offset writer
gcode:
  {action_raise_error("Switch Z is preliminary only. Do not save it as final Z; use an attended first-layer test.")}

#####################################################################
# Axiscope - camera XY plus attended coarse relative-Z measurement
# Pin: PF2 on BTT Manta M8P V2.0
#
# Do not add [tools_calibrate]: it conflicts with Axiscope's probe_multi_axis.
# config_file_path is intentionally omitted so Axiscope cannot overwrite
# production tool offsets. Transfer reviewed XY results manually; treat switch
# Z results as preliminary and finalize each tool with a first-layer test.
#####################################################################

# Sharing: change switch pin and measured X/Y/contact Z here AND the
# _CALIBRATION_SWITCH report in toolchanger-config.cfg. Its probe_z must equal
# zswitch_z_pos + lift_z. Keep this independent of LDC1612 bed geometry.
[axiscope]
pin: ^PF2
zswitch_x_pos: 81.0
zswitch_y_pos: -7.0
# Axiscope moves to zswitch_z_pos + lift_z before probing downward. The values
# below start at Z4, 1 mm above the operator-observed T0 trigger at Z3.
zswitch_z_pos: 3.0
lift_z: 1.0
move_speed: 60
z_move_speed: 4
samples: 5
start_gcode:
  BED_MESH_CLEAR
  STOP_CRASH_DETECTION
before_pickup_gcode:
  _CALIBRATE_SAFE_TRANSIT
after_pickup_gcode:
  M109 S150
finish_gcode:
  _CALIBRATE_SAFE_TRANSIT
  T0
  TURN_OFF_HEATERS
  START_CRASH_DETECTION
  RESPOND MSG="Coarse switch Z complete. Do not save it as final Z; verify every tool with a first-layer test."

[gcode_macro _CALIBRATE_SAFE_TRANSIT]
description: Lift vertically to the calibration-switch clearance before XY travel or tool changes
gcode:
  {% if printer["gcode_macro _TOOL_RECOVERY"].required|int %}
    {action_raise_error("Calibration transit requires confirmed tool recovery")}
  {% endif %}
  {% set switch = printer["gcode_macro _CALIBRATION_SWITCH"] %}
  {% if switch.z|float <= 0 or "xyz" not in printer.toolhead.homed_axes %}
    {action_raise_error("A positive switch transit height and homed XYZ are required for safe travel.")}
  {% endif %}
  # Evaluate the current Z when called, including after a probe or tool change.
  {% set travel_z = [printer.gcode_move.gcode_position.z|float, switch.z|float]|max %}
  G90
  G0 Z{travel_z} F2400

[gcode_macro CALIBRATE_MOVE_OVER_PROBE]
description: Position safely over the removable front PF2 calibration switch
gcode:
  {% set phase = printer["gcode_macro _PRINT_STATE"].state|lower %}
  {% set bench_running = printer["gcode_macro _TOOL_HEATUP_VARS"].is_running|int if printer["gcode_macro _TOOL_HEATUP_VARS"] is defined else 0 %}
  {% if phase not in ["idle", "calibrating"] or printer.pause_resume.is_paused or printer.print_stats.state|lower in ["printing", "paused"] or printer["gcode_macro _TOOL_RECOVERY"].required|int or bench_running or printer["gcode_macro _DRYER_STATUS"].is_drying|int %}
    {action_raise_error("Switch positioning requires idle/calibrating state without competing operations or recovery")}
  {% endif %}
  {% set switch = printer["gcode_macro _CALIBRATION_SWITCH"] %}
  {% if switch.z|float <= 0 %}
    {action_raise_error("Set a positive safe transit height for the front PF2 switch holder.")}
  {% endif %}
  {% if "xyz" not in printer.toolhead.homed_axes %}
    {action_raise_error("Remove the PF2 holder and home XYZ, then reinstall it before switch calibration.")}
  {% endif %}
  {% set travel_z = [printer.gcode_move.gcode_position.z|float, switch.z|float]|max %}
  BED_MESH_CLEAR
  G90
  G0 Z{travel_z} F2400
  G0 X{switch.x} Y{switch.y} F6000
  G0 Z{switch.z} F2400

[gcode_macro CALIBRATE_ALL_OFFSETS]
description: Disabled legacy XYZ calibration command
gcode:
  {action_raise_error("Legacy XYZ calibration is disabled. Use Axiscope for XY, CALIBRATE_COARSE_Z_OFFSETS for preliminary Z, then first-layer tests for final Z.")}

[gcode_macro CALIBRATE_COARSE_Z_OFFSETS]
description: Run the attended PF2 switch measurement for preliminary relative Z only
gcode:
  {% set confirmed = params.CONFIRM|default(0)|int %}
  {% set phase = printer["gcode_macro _PRINT_STATE"].state|string|lower %}
  {% set bench_running = printer["gcode_macro _TOOL_HEATUP_VARS"].is_running|int if printer["gcode_macro _TOOL_HEATUP_VARS"] is defined else 0 %}
  {% if "xyz" not in printer.toolhead.homed_axes %}
    {action_raise_error("Remove the switch holder, home XYZ, then reinstall it before coarse-Z calibration.")}
  {% elif printer.toolchanger.status != "ready" %}
    {action_raise_error("Initialize the toolchanger and verify tool detection before calibration.")}
  {% elif phase != "idle" or printer.pause_resume.is_paused or printer.print_stats.state|lower in ["printing", "paused"] %}
    {action_raise_error("Coarse-Z calibration requires an idle, unpaused printer")}
  {% elif printer["gcode_macro _TOOL_RECOVERY"].required|int or printer["gcode_macro _DRYER_STATUS"].is_drying|int or bench_running %}
    {action_raise_error("Finish tool recovery, drying and benchmarking before calibration")}
  {% elif 0 not in printer.toolchanger.tool_numbers or printer.axiscope is not defined %}
    {action_raise_error("Coarse-Z requires reference T0 and the Axiscope backend")}
  {% elif confirmed != 1 %}
    {action_raise_error("Run QUERY_ENDSTOPS with PF2 released and pressed. Then rerun CALIBRATE_COARSE_Z_OFFSETS CONFIRM=1 while attended.")}
  {% else %}
    RESPOND MSG="Confirmed attended preliminary-Z run at X81 Y-7 from Z4; keep E-stop ready."
    SET_GCODE_VARIABLE MACRO=_PRINT_STATE VARIABLE=state VALUE="'calibrating'"
    # Preserve Axiscope's per-tool measurement and hooks, but own the ordering
    # of the final return. Its original Python command returns T0 too early.
    AXISCOPE_START_GCODE
    {% for tn in [0] + (printer.toolchanger.tool_numbers|reject("equalto", 0)|list) %}
      AXISCOPE_BEFORE_PICKUP_GCODE
      T{tn}
      AXISCOPE_AFTER_PICKUP_GCODE
      MOVE_TO_ZSWITCH
      PROBE_ZSWITCH SAMPLES={printer.configfile.settings.axiscope.samples|int}
    {% endfor %}
    _CALIBRATE_SAFE_TRANSIT
    T0
    M400
    TURN_OFF_HEATERS
    _CALIBRATE_COARSE_REPORT
    AXISCOPE_FINISH_GCODE
    SET_GCODE_VARIABLE MACRO=_PRINT_STATE VARIABLE=state VALUE="'idle'"
  {% endif %}

[gcode_macro CALIBRATE_ALL_Z_OFFSETS]
description: Route Axiscope batch calibration through the attended safe CFG workflow
rename_existing: _AXISCOPE_CALIBRATE_ALL_Z_OFFSETS
gcode:
  CALIBRATE_COARSE_Z_OFFSETS {rawparams}

[gcode_macro _CALIBRATE_COARSE_REPORT]
description: Report newly measured relative Z values without saving offsets
gcode:
  {% set results = printer.axiscope.probe_results %}
  {% for tn in printer.toolchanger.tool_numbers %}
    {% set key = tn|string %}
    {% if key not in results or results[key].z_offset is none %}
      {action_raise_error("Axiscope result missing; no offsets were saved")}
    {% endif %}
    RESPOND MSG="T{tn} preliminary gcode_z_offset: {results[key].z_offset|float|round(4)}"
  {% endfor %}
