############################################################################
# NOZZLE-CLEAN.CFG - T0 purge and silicone-pad cleaning before Cartographer
#
# VERIFIED MACHINE COORDINATES (T0 only):
#   Purge point : X315 Y1 Z6
#   Silicone pad: X277..312, Y-10..0, contact Z0.5..1.0
#   Work inset  : X278..311, Y-9..-1, default contact Z1.0
#
# CLEAN_NOZZLE modes:
#   DEEP  - optional hot purge, warm pickup passes, then a final <=150 C pass.
#   TOUCH - no purge; one final <=150 C pass immediately before Touch home.
#
# Examples:
#   CLEAN_NOZZLE MODE=TOUCH TEMP=150 CLEAN_Z=1.0 WIPES=1
#   CLEAN_NOZZLE MODE=DEEP TEMP=150 CLEAN_Z=1.0 WIPES=2 PURGE=40 PURGE_TEMP=250
#   PURGE_AND_CLEAN PURGE_TEMP=250
############################################################################

# Retain arc support for sliced files even though this cleaner uses G1 only.
[gcode_arcs]
resolution: 0.1

############################################################################
# CLEAN_NOZZLE
#
# Safety contract:
#   - T0 is physically detected, KTC is ready, and XYZ is already homed.
#   - Live G-code offsets and bed mesh are clear.
#   - Cleaning is only allowed while the project print state is idle/starting.
#   - Every XY transfer occurs at or above safe_z; contact moves stay inside
#     the measured silicone-pad inset.
############################################################################

[gcode_macro CLEAN_NOZZLE]
description: T0 purge and silicone-pad clean for Cartographer Touch
variable_safe_z: 15.0
variable_purge_x: 315.0
variable_purge_y: 1.0
variable_purge_z: 6.0
variable_approach_z: 3.0
variable_pad_x_left: 278.0
variable_pad_x_mid: 294.5
variable_pad_x_right: 311.0
variable_pad_y_top: -1.0
variable_pad_y_mid: -5.0
variable_pad_y_bottom: -9.0
variable_default_clean_z: 1.0
variable_travel_f: 9000
variable_z_f: 1500
variable_contact_z_f: 600
variable_scrub_x_f: 6000
variable_scrub_y_f: 3000
variable_purge_f: 200
variable_retract_f: 300
gcode:
    {% set cfg = printer["gcode_macro CLEAN_NOZZLE"] %}
    {% set mode = params.MODE|default("DEEP")|string|upper %}
    {% set default_wipes = 2 if mode == "DEEP" else 1 %}
    {% set wipes = params.WIPES|default(params.PASSES|default(default_wipes))|int %}
    {% set clean_temp = params.TEMP|default(150)|int %}
    {% set clean_z = params.CLEAN_Z|default(params.WIPE_Z|default(cfg.default_clean_z))|float %}
    {% set purge_mm = params.PURGE|default(0)|float %}
    {% set purge_t = params.PURGE_TEMP|default(0)|int %}
    {% set retract_mm = params.RETRACT|default(0.8)|float %}
    {% set active_tool = printer.toolchanger.tool_number|default(-1)|int %}
    {% set extruder = printer.toolhead.extruder|default("")|string %}
    {% set print_state = printer["gcode_macro _PRINT_STATE"].state|default("unknown")|string|lower %}
    {% set origin = printer.gcode_move.homing_origin %}
    {% set mesh = printer.bed_mesh.mesh_matrix|default([[]]) %}
    {% set mesh_active = mesh|length > 0 and mesh[0]|length > 0 %}
    {% set qgl_applied = printer.quad_gantry_level.applied|default(false) %}
    {% set transit_z = [printer.toolhead.position.z|float, cfg.safe_z|float]|max %}

    {% if mode not in ["DEEP", "TOUCH"] %}
        {action_raise_error("CLEAN_NOZZLE MODE must be DEEP or TOUCH")}
    {% elif printer.toolchanger.status != "ready" %}
        {action_raise_error("CLEAN_NOZZLE requires toolchanger status ready")}
    {% elif active_tool != 0 or extruder != "extruder" %}
        {action_raise_error("CLEAN_NOZZLE is calibrated for detected T0 only")}
    {% elif "xyz" not in printer.toolhead.homed_axes %}
        {action_raise_error("CLEAN_NOZZLE requires XYZ homed; automatic homing is intentionally disabled")}
    {% elif print_state not in ["idle", "starting"] %}
        {action_raise_error("CLEAN_NOZZLE is allowed only while print state is idle or starting")}
    {% elif (origin.x|float)|abs > 0.001 or (origin.y|float)|abs > 0.001 or (origin.z|float)|abs > 0.001 %}
        {action_raise_error("CLEAN_NOZZLE requires zero X/Y/Z G-code offsets")}
    {% elif mesh_active %}
        {action_raise_error("CLEAN_NOZZLE requires BED_MESH_CLEAR before fixed-coordinate cleaning")}
    {% elif clean_temp < 140 or clean_temp > 150 %}
        {action_raise_error("CLEAN_NOZZLE TEMP must be 140..150 C for Cartographer-safe cleaning")}
    {% elif clean_z < 0.5 or clean_z > 1.0 %}
        {action_raise_error("CLEAN_NOZZLE CLEAN_Z must be within the measured 0.5..1.0 mm contact range")}
    {% elif wipes < 1 or wipes > 5 %}
        {action_raise_error("CLEAN_NOZZLE WIPES must be 1..5")}
    {% elif purge_mm < 0 or purge_mm > 80 %}
        {action_raise_error("CLEAN_NOZZLE PURGE must be 0..80 mm; T0 max_extrude_only_distance is 101 mm")}
    {% elif retract_mm < 0 or retract_mm > 2 %}
        {action_raise_error("CLEAN_NOZZLE RETRACT must be 0..2 mm")}
    {% elif mode == "TOUCH" and purge_mm > 0 %}
        {action_raise_error("CLEAN_NOZZLE MODE=TOUCH prohibits purge; use MODE=DEEP")}
    {% elif purge_mm > 0 and (purge_t < 170 or purge_t > 280) %}
        {action_raise_error("CLEAN_NOZZLE PURGE_TEMP must be 170..280 C when PURGE is enabled")}
    {% elif mode == "TOUCH" and not qgl_applied %}
        {action_raise_error("CLEAN_NOZZLE MODE=TOUCH requires QUAD_GANTRY_LEVEL applied")}
    {% else %}
        {% set fan_name = "T0_part_fan" %}
        {% set fan_section = "fan_generic " ~ fan_name %}
        {% set old_fan_speed = printer[fan_section].speed|float %}

        # Confirm the physical T0 sensor before any cleaning-station motion.
        VERIFY_TOOL_DETECTED T=0
        SAVE_GCODE_STATE NAME=clean_nozzle_state
        G90
        M220 S100
        M221 S100
        _SET_LED_STATUS_CLEANING

        # Safe vertical lift, XY transfer, then descend over the purge bucket.
        M117 T0 purge station
        G1 Z{transit_z} F{cfg.z_f}
        G1 X{cfg.purge_x} Y{cfg.purge_y} F{cfg.travel_f}
        G1 Z{cfg.purge_z} F{cfg.z_f}

        {% if purge_mm > 0 %}
            M117 Purge T0 {purge_mm|round(1)}mm
            SET_HEATER_TEMPERATURE HEATER=extruder TARGET={purge_t}
            TEMPERATURE_WAIT SENSOR=extruder MINIMUM={purge_t} MAXIMUM={purge_t + 2}
            _CLEAN_NOZZLE_PURGE EXTRUDER=extruder PURGE={purge_mm} RETRACT={retract_mm}
        {% endif %}

        # Bambu-inspired sequence: cool/soften, pick up the blob, then complete
        # the last pass only after the nozzle is inside the Touch-safe window.
        SET_HEATER_TEMPERATURE HEATER=extruder TARGET={clean_temp}
        {% if mode == "DEEP" %}
            SET_FAN_SPEED FAN={fan_name} SPEED=0.70
            TEMPERATURE_WAIT SENSOR=extruder MINIMUM={clean_temp - 2} MAXIMUM=170
            {% if wipes > 1 %}
                _CLEAN_NOZZLE_WIPE_PATH CLEAN_Z={clean_z} WIPES={wipes - 1} START_REVERSE=0
            {% endif %}
            SET_FAN_SPEED FAN={fan_name} SPEED=1.0
            TEMPERATURE_WAIT SENSOR=extruder MINIMUM={clean_temp - 2} MAXIMUM={clean_temp}
            _CLEAN_NOZZLE_WIPE_PATH CLEAN_Z={clean_z} WIPES=1 START_REVERSE={(wipes - 1) % 2}
        {% else %}
            SET_FAN_SPEED FAN={fan_name} SPEED=1.0
            TEMPERATURE_WAIT SENSOR=extruder MINIMUM={clean_temp - 2} MAXIMUM={clean_temp}
            _CLEAN_NOZZLE_WIPE_PATH CLEAN_Z={clean_z} WIPES={wipes} START_REVERSE=0
        {% endif %}

        # Explicit upper bound: the following Cartographer Touch must never see
        # an M109 deadband completion above the configured cleaning temperature.
        TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={clean_temp}
        SET_FAN_SPEED FAN={fan_name} SPEED={old_fan_speed}

        {% if mode == "DEEP" %}
            # Park over the bucket during bed soak so any later ooze misses the bed.
            G1 X{cfg.purge_x} Y{cfg.purge_y} F{cfg.travel_f}
            G1 Z{cfg.purge_z} F{cfg.z_f}
        {% endif %}

        M400
        M117 T0 clean; ready for Touch
        _SET_LED_STATUS_READY
        RESTORE_GCODE_STATE NAME=clean_nozzle_state MOVE=0
    {% endif %}

############################################################################
# _CLEAN_NOZZLE_PURGE - runtime helper rendered after the temperature wait
#
# This must remain a separate macro: Klipper renders the caller's Jinja before
# executing its heat wait, so can_extrude must be checked in a later render.
############################################################################

[gcode_macro _CLEAN_NOZZLE_PURGE]
description: Internal T0 purge after reaching purge temperature
gcode:
    {% set cfg = printer["gcode_macro CLEAN_NOZZLE"] %}
    {% set extruder = params.EXTRUDER|default("")|string %}
    {% set purge_mm = params.PURGE|default(0)|float %}
    {% set retract_mm = params.RETRACT|default(0.8)|float %}
    {% set active_tool = printer.toolchanger.tool_number|default(-1)|int %}
    {% set print_state = printer["gcode_macro _PRINT_STATE"].state|default("unknown")|string|lower %}
    {% set origin = printer.gcode_move.homing_origin %}
    {% set position = printer.gcode_move.gcode_position %}
    {% set mesh = printer.bed_mesh.mesh_matrix|default([[]]) %}
    {% set mesh_active = mesh|length > 0 and mesh[0]|length > 0 %}

    {% if printer.toolchanger.status != "ready" %}
        {action_raise_error("_CLEAN_NOZZLE_PURGE requires toolchanger status ready")}
    {% elif "xyz" not in printer.toolhead.homed_axes %}
        {action_raise_error("_CLEAN_NOZZLE_PURGE requires XYZ homed")}
    {% elif active_tool != 0 or extruder != "extruder" %}
        {action_raise_error("_CLEAN_NOZZLE_PURGE is calibrated for active T0 only")}
    {% elif print_state not in ["idle", "starting"] %}
        {action_raise_error("_CLEAN_NOZZLE_PURGE is allowed only while print state is idle or starting")}
    {% elif (origin.x|float)|abs > 0.001 or (origin.y|float)|abs > 0.001 or (origin.z|float)|abs > 0.001 or mesh_active %}
        {action_raise_error("_CLEAN_NOZZLE_PURGE requires zero offsets and no active bed mesh")}
    {% elif ((position.x|float) - (cfg.purge_x|float))|abs > 0.2 or ((position.y|float) - (cfg.purge_y|float))|abs > 0.2 or ((position.z|float) - (cfg.purge_z|float))|abs > 0.2 %}
        {action_raise_error("_CLEAN_NOZZLE_PURGE requires T0 at the verified X315 Y1 Z6 purge point")}
    {% elif purge_mm <= 0 or purge_mm > 80 %}
        {action_raise_error("_CLEAN_NOZZLE_PURGE PURGE must be >0 and <=80 mm")}
    {% elif retract_mm < 0 or retract_mm > 2 %}
        {action_raise_error("_CLEAN_NOZZLE_PURGE RETRACT must be 0..2 mm")}
    {% elif printer[extruder].temperature|float > 282 %}
        {action_raise_error("_CLEAN_NOZZLE_PURGE refuses extrusion above the configured 280 C purge limit")}
    {% elif not printer[extruder].can_extrude %}
        {action_raise_error("_CLEAN_NOZZLE_PURGE: T0 is not hot enough to extrude")}
    {% else %}
        VERIFY_TOOL_DETECTED T=0
        SAVE_GCODE_STATE NAME=clean_nozzle_purge_state
        M83
        G1 E{purge_mm} F{cfg.purge_f}
        M400
        G4 P500
        G1 E-{retract_mm} F{cfg.retract_f}
        M400
        RESTORE_GCODE_STATE NAME=clean_nozzle_purge_state MOVE=0
    {% endif %}

############################################################################
# _CLEAN_NOZZLE_WIPE_PATH - enhanced silicone-pad path
#
# The path uses multiple X/Y tracks and alternates direction. It reaches only
# X278..311 and Y-9..-1. Z is lowered only after arriving at X311 Y-5, and is
# raised vertically to Z15 before leaving the pad.
############################################################################

[gcode_macro _CLEAN_NOZZLE_WIPE_PATH]
description: Internal multi-track T0 silicone-pad wipe
gcode:
    {% set cfg = printer["gcode_macro CLEAN_NOZZLE"] %}
    {% set clean_z = params.CLEAN_Z|default(cfg.default_clean_z)|float %}
    {% set wipes = params.WIPES|default(1)|int %}
    {% set start_reverse = params.START_REVERSE|default(0)|int %}
    {% set active_tool = printer.toolchanger.tool_number|default(-1)|int %}
    {% set extruder = printer.toolhead.extruder|default("")|string %}
    {% set print_state = printer["gcode_macro _PRINT_STATE"].state|default("unknown")|string|lower %}
    {% set origin = printer.gcode_move.homing_origin %}
    {% set mesh = printer.bed_mesh.mesh_matrix|default([[]]) %}
    {% set mesh_active = mesh|length > 0 and mesh[0]|length > 0 %}
    {% set transit_z = [printer.toolhead.position.z|float, cfg.safe_z|float]|max %}

    {% if printer.toolchanger.status != "ready" or active_tool != 0 or extruder != "extruder" %}
        {action_raise_error("_CLEAN_NOZZLE_WIPE_PATH requires detected T0 and ready toolchanger")}
    {% elif "xyz" not in printer.toolhead.homed_axes %}
        {action_raise_error("_CLEAN_NOZZLE_WIPE_PATH requires XYZ homed")}
    {% elif print_state not in ["idle", "starting"] %}
        {action_raise_error("_CLEAN_NOZZLE_WIPE_PATH is allowed only while print state is idle or starting")}
    {% elif (origin.x|float)|abs > 0.001 or (origin.y|float)|abs > 0.001 or (origin.z|float)|abs > 0.001 or mesh_active %}
        {action_raise_error("_CLEAN_NOZZLE_WIPE_PATH requires zero offsets and no active bed mesh")}
    {% elif clean_z < 0.5 or clean_z > 1.0 %}
        {action_raise_error("_CLEAN_NOZZLE_WIPE_PATH CLEAN_Z must be 0.5..1.0 mm")}
    {% elif wipes < 1 or wipes > 5 %}
        {action_raise_error("_CLEAN_NOZZLE_WIPE_PATH WIPES must be 1..5")}
    {% elif start_reverse not in [0, 1] %}
        {action_raise_error("_CLEAN_NOZZLE_WIPE_PATH START_REVERSE must be 0 or 1")}
    {% else %}
        VERIFY_TOOL_DETECTED T=0
        G90
        G1 Z{transit_z} F{cfg.z_f}
        G1 X{cfg.pad_x_right} Y{cfg.pad_y_mid} F{cfg.travel_f}
        G1 Z{cfg.approach_z} F{cfg.z_f}
        G1 Z{clean_z} F{cfg.contact_z_f}

        {% for i in range(wipes) %}
            {% if (i + start_reverse) % 2 == 0 %}
                G1 Y{cfg.pad_y_top} F{cfg.scrub_y_f}
                G1 X{cfg.pad_x_mid} F{cfg.scrub_x_f}
                G1 Y{cfg.pad_y_bottom} F{cfg.scrub_y_f}
                G1 X{cfg.pad_x_left} F{cfg.scrub_x_f}
                G1 Y{cfg.pad_y_top} F{cfg.scrub_y_f}
                G1 X{cfg.pad_x_mid} F{cfg.scrub_x_f}
                G1 Y{cfg.pad_y_bottom} F{cfg.scrub_y_f}
                G1 X{cfg.pad_x_right} F{cfg.scrub_x_f}
                G1 Y{cfg.pad_y_mid} F{cfg.scrub_y_f}
            {% else %}
                G1 Y{cfg.pad_y_bottom} F{cfg.scrub_y_f}
                G1 X{cfg.pad_x_mid} F{cfg.scrub_x_f}
                G1 Y{cfg.pad_y_top} F{cfg.scrub_y_f}
                G1 X{cfg.pad_x_left} F{cfg.scrub_x_f}
                G1 Y{cfg.pad_y_bottom} F{cfg.scrub_y_f}
                G1 X{cfg.pad_x_mid} F{cfg.scrub_x_f}
                G1 Y{cfg.pad_y_top} F{cfg.scrub_y_f}
                G1 X{cfg.pad_x_right} F{cfg.scrub_x_f}
                G1 Y{cfg.pad_y_mid} F{cfg.scrub_y_f}
            {% endif %}
        {% endfor %}

        G1 Z{cfg.approach_z} F{cfg.contact_z_f}
        G1 Z{transit_z} F{cfg.z_f}
        M400
    {% endif %}

############################################################################
# _CLEAN_NOZZLE_PARK - T0 park over the purge bucket without wiping
############################################################################

[gcode_macro _CLEAN_NOZZLE_PARK]
description: Park detected T0 over the purge bucket
gcode:
    {% set cfg = printer["gcode_macro CLEAN_NOZZLE"] %}
    {% set active_tool = printer.toolchanger.tool_number|default(-1)|int %}
    {% set extruder = printer.toolhead.extruder|default("")|string %}
    {% set print_state = printer["gcode_macro _PRINT_STATE"].state|default("unknown")|string|lower %}
    {% set origin = printer.gcode_move.homing_origin %}
    {% set mesh = printer.bed_mesh.mesh_matrix|default([[]]) %}
    {% set mesh_active = mesh|length > 0 and mesh[0]|length > 0 %}
    {% set transit_z = [printer.toolhead.position.z|float, cfg.safe_z|float]|max %}

    {% if printer.toolchanger.status != "ready" or active_tool != 0 or extruder != "extruder" %}
        {action_raise_error("_CLEAN_NOZZLE_PARK requires detected T0 and ready toolchanger")}
    {% elif "xyz" not in printer.toolhead.homed_axes %}
        {action_raise_error("_CLEAN_NOZZLE_PARK requires XYZ homed")}
    {% elif print_state not in ["idle", "starting"] %}
        {action_raise_error("_CLEAN_NOZZLE_PARK is allowed only while print state is idle or starting")}
    {% elif (origin.x|float)|abs > 0.001 or (origin.y|float)|abs > 0.001 or (origin.z|float)|abs > 0.001 or mesh_active %}
        {action_raise_error("_CLEAN_NOZZLE_PARK requires zero offsets and no active bed mesh")}
    {% else %}
        VERIFY_TOOL_DETECTED T=0
        G90
        G1 Z{transit_z} F{cfg.z_f}
        G1 X{cfg.purge_x} Y{cfg.purge_y} F{cfg.travel_f}
        G1 Z{cfg.purge_z} F{cfg.z_f}
        M117 T0 parked at purge bucket
    {% endif %}

############################################################################
# PURGE_AND_CLEAN - attended/manual deep clean wrapper
#
# PURGE_TEMP is intentionally required. The macro must not guess the loaded
# material's extrusion temperature. Default PURGE=40 leaves about 30 mm of
# visible output after the project's known 10 mm PRINT_END retract recovery.
############################################################################

[gcode_macro PURGE_AND_CLEAN]
description: Manual T0 hot purge then two-stage silicone clean
gcode:
    {% set purge_mm = params.PURGE|default(40)|float %}
    {% set purge_temp = params.PURGE_TEMP|default(0)|int %}
    {% set clean_temp = params.TEMP|default(150)|int %}
    {% set clean_z = params.CLEAN_Z|default(1.0)|float %}
    {% set wipes = params.WIPES|default(2)|int %}
    {% set retract_mm = params.RETRACT|default(0.8)|float %}

    CLEAN_NOZZLE MODE=DEEP TEMP={clean_temp} CLEAN_Z={clean_z} WIPES={wipes} PURGE={purge_mm} PURGE_TEMP={purge_temp} RETRACT={retract_mm}
