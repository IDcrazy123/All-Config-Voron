# Sharing scope: measured input-shaper/ADXL/ShakeTune reference.
# Requires an existing [adxl345] matching accel_chip below. Calibrate your own
# frequencies/types/damping; these measurements are not a generic shuttle tune.
# Select an accessible probe_points location with safe Z on your machine.
# [shaketune] and its commands require the ShakeTune plugin: omit that SECTION
# and omit ShakeTune/AXES_SHAPER_CALIBRATION calls if the plugin is absent.
# Merge with existing [input_shaper]/[resonance_tester], do not duplicate sections.
# Check KTC after_change_gcode for inherited per-tool damping overrides as well.

############################################################################
# INPUT-SHAPER.CFG - Resonance Tester and ShakeTune
# 
# UNIFIED SHUTTLE SHAPER (2026-09-03):
# All 5 toolheads (T0..T4) share the same carriage shuttle and exhibit closely
# matching resonance frequencies (~44-50 Hz on X, ~30-35 Hz on Y).
# To eliminate toolchange latency and command stalls during multi-color printing,
# a single global [input_shaper] profile is calibrated using the Cartographer
# onboard ADXL345 on the shuttle. Per-tool overrides in tools/Tn.cfg are commented
# out for frequency/type. KTC inherited damping may still override the global
# damping in after_change_gcode; inspect effective values after selecting a tool.
#
# RESONANCE TEST PROCEDURE:
# - Cartographer onboard ADXL345 is permanently configured as `accel_chip: adxl345`.
# - Run `AXES_SHAPER_CALIBRATION` or ShakeTune commands directly without changing pins.
############################################################################

[input_shaper]
# Unified shuttle calibration from Cartographer ADXL345 (2026-09-03).
# Optimal central frequencies covering all 5 tools (T0..T4).
shaper_type_x: mzv
shaper_freq_x: 43.6
damping_ratio_x: 0.124
shaper_type_y: mzv
shaper_freq_y: 33.4
damping_ratio_y: 0.080

[resonance_tester]
accel_chip: adxl345  # Cartographer onboard ADXL345 on the shuttle carriage
# Nozzle coordinates in mm: select a clear point within your travel.
probe_points: 180, 168, 20
sweeping_accel: 400
sweeping_period: 0

[shaketune]
result_folder: ~/printer_data/config/Generated-Data/ShakeTune
number_of_results_to_keep: 10
keep_raw_data: False
show_macros_in_webui: True
timeout: 900    # Enough time for the CM4 to process the graphs
max_freq: 150   # >= the maximum test frequency used by the macro, 134 Hz
dpi: 150        # Use 150 dpi instead of 300; images are 4x smaller and save RAM
