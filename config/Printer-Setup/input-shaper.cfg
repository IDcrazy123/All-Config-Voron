# ============================================================================
# INPUT-SHAPER.CFG - Shuttle shaping and resonance analysis
# Purpose: Set the measured global input shaper and resonance-test configuration.
# Loading: Included once by printer.cfg with the installed ShakeTune extension.
# The resonance tester uses the Cartographer onboard ADXL345 defined by the probe file.
# Main calibration command: AXES_SHAPER_CALIBRATION, supplied by ShakeTune.
# Generated analysis is stored under config/Generated-Data/ShakeTune.
# Local setup: Measured shaper types/frequencies/damping and the clear probe point.
# The user-owned KTC hook uses global damping unless a positive per-tool
# frequency explicitly enables that axis's custom profile.
# ============================================================================

# Sharing scope: measured input-shaper/ADXL/ShakeTune reference.
# Requires an existing [adxl345] matching accel_chip below. Calibrate your own
# frequencies/types/damping; these measurements are not a generic shuttle tune.
# Select an accessible probe_points location with safe Z on your machine.
# [shaketune] and its commands require the ShakeTune plugin: omit that SECTION
# and omit ShakeTune/AXES_SHAPER_CALIBRATION calls if the plugin is absent.
# Merge with existing [input_shaper]/[resonance_tester], do not duplicate sections.
# Check KTC after_change_gcode for inherited per-tool damping overrides as well.

# One shuttle profile is applied to T0-T4. A tool opts into a per-axis override
# only when its explicit frequency is positive; inherited damping alone does
# not replace the global tune. The resonance tester uses Cartographer's ADXL345.

[input_shaper]
# Measured shuttle profile shared by all five tools unless explicitly overridden.
shaper_type_x: mzv
shaper_freq_x: 43.6
damping_ratio_x: 0.124
shaper_type_y: mzv
shaper_freq_y: 33.4
damping_ratio_y: 0.080

[resonance_tester]
accel_chip: adxl345  # Cartographer onboard ADXL345 on the shuttle carriage
# Nozzle coordinates in mm: select a clear point within your travel.
probe_points: 180, 168, 20
sweeping_accel: 400
sweeping_period: 0

[shaketune]
result_folder: ~/printer_data/config/Generated-Data/ShakeTune
number_of_results_to_keep: 10
keep_raw_data: False
show_macros_in_webui: True
timeout: 900    # Enough time for the CM4 to process the graphs
max_freq: 150   # >= the maximum test frequency used by the macro, 134 Hz
dpi: 150        # Use 150 dpi instead of 300; images are 4x smaller and save RAM
