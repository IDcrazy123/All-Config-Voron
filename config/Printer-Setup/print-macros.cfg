# PRINT-MACROS.CFG - production print lifecycle for KTC-Easy and Cartographer.
# Requires T0, CLEAN_NOZZLE, PRIME_LINES, QGL/mesh, Mainsail client helpers,
# bed_fan/bed_fan_off_delay, and the LED helpers in fans-leds.cfg.
# The active Orca start command is in Orca Config/Voron Stealthchanger.json.
# PRINT_START takes TOOL, TOOL_TEMP, BED_TEMP, and Tn_TEMP only for used tools.
# T0_PURGE_TEMP and T0_MATERIAL describe loaded T0 filament even if T0 is not
# printed; an enabled empty T0 sensor selects a dry wipe. MATERIAL, SOAK,
# AUTO_SOAK and FULL_BED control settling before QGL.
# The T0 cleaning path assumes Cartographer on the shuttle. END/CANCEL skip
# docking and parking if tool attachment is uncertain. Motion still needs a
# supervised mechanical route check. EXCLUDE_OBJECT remains guarded for
# multi-tool jobs because the native extrusion-state issue is unresolved.

[idle_timeout]
timeout: 1800

[exclude_object]

[gcode_macro EXCLUDE_OBJECT]
description: Keep query/reset support but reject unsafe multi-tool exclusion
rename_existing: _EXCLUDE_OBJECT_BASE
gcode:
    {% set ps = printer["gcode_macro _PRINT_STATE"] %}
    {% set exclude = params.NAME|default("") != "" or params.CURRENT|default("") != "" %}
    # Native RESET uses string truthiness: RESET= is empty and does not reset.
    {% if params.RESET|default("") == "" and exclude and printer.toolchanger.tool_numbers|length > 1 and (ps.used_tool_count|int != 1 or ps.state not in ["starting", "printing", "paused"]) %}
        {action_raise_error("Multi-tool/unknown-job exclusion is blocked: this Klipper runtime shares extrusion state. Query and RESET remain available.")}
    {% endif %}
    _EXCLUDE_OBJECT_BASE {rawparams}

# KTC hooks read this phase while print_stats can still report "printing"
# during PRINT_START or PRINT_END.

[gcode_macro _PRINT_STATE]
description: Internal variable tracking print state: printing/paused/idle
variable_state: "idle"
variable_paused_tool: -1
variable_used_tool_count: 0
gcode:
    # No gcode; this macro only stores a variable.

[gcode_macro G32]
description: Home all axes and level gantry
gcode:
    _REQUIRE_MOTION_PREPARATION
    _SET_LED_STATUS_LEVELING
    BED_MESH_CLEAR
    G28
    QUAD_GANTRY_LEVEL
    # QGL already homes Z at its end.
    G0 X180 Y180 Z30 F3600
    _SET_LED_STATUS_READY


# BED_MESH_CALIBRATE is native; bed heat stays on during Cartographer scan.


[gcode_macro QUAD_GANTRY_LEVEL]
description: Quad gantry level (QGL)
rename_existing: _QUAD_GANTRY_LEVEL
gcode:
    _REQUIRE_MOTION_PREPARATION
    INITIALIZE_TOOLCHANGER
    _REQUIRE_TOOL_STATE
    _SET_LED_STATUS_LEVELING
    SAVE_GCODE_STATE NAME=STATE_QGL
    BED_MESH_CLEAR
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    {% if not printer.quad_gantry_level.applied %}
        _QUAD_GANTRY_LEVEL horizontal_move_z=10 retry_tolerance=1
    {% endif %}
    _QUAD_GANTRY_LEVEL horizontal_move_z=2
    G28 Z
    RESTORE_GCODE_STATE NAME=STATE_QGL
    _SET_LED_STATUS_READY

[gcode_macro _REQUIRE_MOTION_PREPARATION]
description: Allow preparation motion only while idle or inside PRINT_START
gcode:
    {% set phase = printer["gcode_macro _PRINT_STATE"].state|lower %}
    {% set recovery = printer["gcode_macro _TOOL_RECOVERY"].required|int if printer["gcode_macro _TOOL_RECOVERY"] is defined else 0 %}
    {% if recovery %}
        {action_raise_error("Preparation motion refused during a tool crash; inspect the tool, then RESUME or CANCEL_PRINT")}
    {% elif phase not in ["idle", "starting"] or printer.pause_resume.is_paused or printer["gcode_macro _TOOL_HEATUP_VARS"].is_running|int or (phase != "starting" and printer.print_stats.state|lower in ["printing", "paused"]) %}
        {action_raise_error("Preparation motion requires idle status or the PRINT_START preparation phase")}
    {% endif %}

[gcode_macro _REQUIRE_TOOL_STATE]
description: Require a freshly initialized, consistent toolchanger before motion
gcode:
    {% set active = printer.toolchanger.tool_number|default(-1)|int %}
    {% set detected = printer.toolchanger.detected_tool_number|default(-1)|int %}
    {% if printer.toolchanger.status != "ready" or active != detected %}
        {action_raise_error("Motion refused: toolchanger and presence sensor disagree; inspect the dock/tool")}
    {% endif %}
    {% if active >= 0 %}
        VERIFY_TOOL_DETECTED T={active}
    {% endif %}


[quad_gantry_level]
gantry_corners:
    -10, -10
    353, 350
points:
    20, 0
    20, 280
    330, 280
    330, 0
speed: 200
horizontal_move_z: 10
retries: 5
retry_tolerance: 0.0075
max_adjust: 10

[gcode_macro _PRINT_START_SELECT_T0]
description: Select T0 during PRINT_START after full homing
gcode:
    {% set active_tool = printer.toolchanger.tool_number|default(-1)|int %}
    {% if active_tool != 0 %}
        M117 Select T0 after full home
        T0
    {% else %}
        # Homing can invalidate the earlier attachment check without a toolchange.
        VERIFY_TOOL_DETECTED T=0
    {% endif %}

############################################################################
# PRINT START - StealthChanger / Cartographer safe-homing flow
#
# Important rule: do not toolchange, dock, or park at the bucket before full G28.
# If the printer is holding T1/T2/T3/T4, the dropoff path needs a valid Z hop;
# therefore PRINT_START must complete full G28 first, raise to a safe Z,
# and only then switch back to T0.
#
# Flow:
#   1. Validate + init + stop crash detection
#   2. Start bed/tool heat async, run full G28 at the start, raise to safe Z
#   3. Preheat used tools to standby; T0 reaches purge heat only at the station
#   4. Select T0; hot-purge loaded filament or dry-wipe an empty T0 at 150C
#   5. Wait bed/soak
#   6. QGL at stable bed temp, then touch home
#   7. Adaptive mesh, then prime all used tools with the initial print tool last
#
# Heat soak notes:
#   - SOAK=<seconds> has highest priority and forces an exact soak time.
#   - Dynamic scaling based on bed pre-heat temperature difference (BED_TEMP - BED_START):
#       - Cold bed (diff > 15C): Full soak time (PLA/TPU: 30s, PETG: 60s, ABS/ASA/PC/NYLON/PA: 90s).
#       - Warm bed (5C < diff <= 15C): Soak time is scaled down to 20% of default (e.g. 18s for ABS).
#       - Hot bed (diff <= 5C): Soak is skipped entirely.
#   - If MATERIAL is not passed, only high bed temperatures get a fallback soak (90s).
############################################################################
[gcode_macro _PRINT_START_HEAT_SOAK]
description: Internal PRINT_START heat soak before Cartographer QGL and mesh
# Sharing: tune soak durations here for bed mass/enclosure; SOAK=<seconds>
# overrides these per job. These are settling times, not heater safety limits.
variable_pla_soak: 30
variable_petg_soak: 60
variable_abs_soak: 90
variable_hot_bed_soak: 90
gcode:
    {% set bed_temp = params.BED_TEMP|default(0)|int %}
    {% set bed_start = params.BED_START|default(printer.heater_bed.temperature)|float %}
    {% set manual = params.SOAK|default(0)|int %}
    {% set material = params.MATERIAL|default("")|string|upper %}
    {% set cfg = printer["gcode_macro _PRINT_START_HEAT_SOAK"] %}
    {% set base = 0 %}
    {% if "PLA" in material or "TPU" in material %}
        {% set base = cfg.pla_soak|int %}
    {% elif "PETG" in material %}
        {% set base = cfg.petg_soak|int %}
    {% elif "ABS" in material or "ASA" in material or "PC" in material or "NYLON" in material or "PA" in material %}
        {% set base = cfg.abs_soak|int %}
    {% elif material == "" and bed_temp >= 90 %}
        {% set base = cfg.hot_bed_soak|int %}
    {% endif %}
    {% if params.FULL_BED|default(0)|int > 0 and base > 0 and base < cfg.petg_soak|int %}
        {% set base = cfg.petg_soak|int %}
    {% endif %}

    {% set diff = bed_temp - bed_start %}
    {% set soak = namespace(seconds=0) %}
    {% if manual > 0 %}
        {% set soak.seconds = manual %}
    {% elif params.AUTO_SOAK|default(1)|int > 0 and base > 0 %}
        {% if diff > 15 %}
            {% set soak.seconds = base %}
        {% elif diff > 5 %}
            {% set soak.seconds = (base * 0.2)|int %}
        {% endif %}
    {% endif %}
    {% if soak.seconds > 0 %}
        M117 Heat soak {soak.seconds}s
        RESPOND TYPE=echo MSG="Heat soak: {soak.seconds}s before QGL/mesh (material={material}, bed rise={diff|round(1)}C)"
        G4 P{soak.seconds * 1000}
    {% else %}
        RESPOND TYPE=echo MSG="Heat soak skipped (material={material}, bed rise={diff|round(1)}C)"
    {% endif %}

[gcode_macro PRINT_START]
description: Start print - safe homing first for StealthChanger
gcode:
    {% set TOOL       = params.TOOL|default(0)|int %}
    {% set TOOL_TEMP  = params.TOOL_TEMP|default(0)|int %}
    {% set BED_TEMP   = params.BED_TEMP|default(0)|int %}
    {% set SOAK_TIME  = params.SOAK|default(0)|int %}
    {% set MATERIAL   = params.MATERIAL|default("")|string|upper %}
    {% set AUTO_SOAK  = params.AUTO_SOAK|default(1)|int %}
    {% set FULL_BED   = params.FULL_BED|default(0)|int %}
    {% set PROBE_TEMP = 150 %}
    {% set T0_PURGE_TEMP = params.T0_TEMP|default(TOOL_TEMP if TOOL == 0 else 0)|int %}
    {% set T0_PURGE_TEMP = params.T0_PURGE_TEMP|default(T0_PURGE_TEMP)|int %}
    {% set T0_MATERIAL = params.T0_MATERIAL|default(MATERIAL if TOOL == 0 else "T0 profile")|string|upper %}
    {% set t0_sensor = "filament_switch_sensor filament_sensor_T0" %}
    {% set t0_has_filament = not (printer[t0_sensor] is defined and printer[t0_sensor].enabled and not printer[t0_sensor].filament_detected) %}
    {% set SAFE_Z     = 10 %}
    {% set START_TEMP_KEY = "T" ~ TOOL ~ "_TEMP" %}
    {% set START_TOOL_TEMP = params[START_TEMP_KEY]|int if START_TEMP_KEY in params else TOOL_TEMP %}
    {% set bed_start = printer.heater_bed.temperature|default(0)|float %}

    {% set phase = printer["gcode_macro _PRINT_STATE"].state|string|lower %}
    {% set recovery = printer["gcode_macro _TOOL_RECOVERY"].required|int if printer["gcode_macro _TOOL_RECOVERY"] is defined else 0 %}
    {% if printer["gcode_macro _TOOL_HEATUP_VARS"] is defined and printer["gcode_macro _TOOL_HEATUP_VARS"].is_running|int == 1 %}
        {action_raise_error("PRINT_START: Stop the heating benchmark before starting a print.")}
    {% elif TOOL not in printer.toolchanger.tool_numbers %}
        {action_raise_error("PRINT_START invalid TOOL=%d; tool does not exist" % TOOL)}
    {% elif START_TOOL_TEMP <= 0 or BED_TEMP <= 0 %}
        {action_raise_error("PRINT_START missing temperature: T%d=%d BED=%d; check Orca Start G-code" % (TOOL, START_TOOL_TEMP, BED_TEMP))}
    {% elif t0_has_filament and (T0_PURGE_TEMP < 170 or T0_PURGE_TEMP > 280) %}
        {action_raise_error("PRINT_START requires T0_PURGE_TEMP=170..280 when the loaded T0 filament will be purged")}
    {% elif recovery %}
        {action_raise_error("PRINT_START blocked by a paused tool crash; inspect the tool, then RESUME or CANCEL_PRINT")}
    {% elif printer.pause_resume.is_paused or phase not in ["idle", "drying"] %}
        {action_raise_error("PRINT_START: finish/cancel the current operation before starting a print")}
    {% elif BED_TEMP >= printer.configfile.settings.heater_bed.max_temp|float %}
        {action_raise_error("PRINT_START: BED_TEMP must be below the configured heater limit")}
    {% endif %}

    # Build and validate the used-tool temperatures once, before any command.
    # The private phase above admits the first virtual-SD PRINT_START even
    # though print_stats already reports printing at that point.
    {% set used = namespace(temps=[], count=0, first_t=TOOL, first_temp=START_TOOL_TEMP, found=0) %}
    {% for tn in printer.toolchanger.tool_numbers %}
        {% set temp_key = "T" ~ tn|string ~ "_TEMP" %}
        {% set requested = params[temp_key]|default(START_TOOL_TEMP if tn == TOOL else 0)|int %}
        {% set tool_name = printer.toolchanger.tool_names[printer.toolchanger.tool_numbers.index(tn)] %}
        {% set ext = printer[tool_name].extruder %}
        {% if requested < 0 %}
            {action_raise_error("PRINT_START: tool temperatures must not be negative")}
        {% elif requested > 0 %}
            {% if not ext or requested < printer.configfile.settings[ext].min_extrude_temp|default(170)|float or requested >= printer.configfile.settings[ext].max_temp|float %}
                {action_raise_error("PRINT_START: a used tool temperature is outside its configured extrusion limits")}
            {% endif %}
            {% set used.count = used.count + 1 %}
            {% if tn != TOOL and used.found == 0 %}
                {% set used.first_t = tn %}
                {% set used.first_temp = requested %}
                {% set used.found = 1 %}
            {% endif %}
        {% endif %}
        {% set _ = used.temps.append(requested) %}
        {% set sensor_name = "filament_switch_sensor filament_sensor_T" ~ tn|string %}
        {% if requested > 0 and printer[sensor_name] is defined and printer[sensor_name].enabled and not printer[sensor_name].filament_detected %}
            {action_raise_error("PRINT_START: load filament into tool T%d first" % tn)}
        {% endif %}
    {% endfor %}

    # A previous print-end cooldown must not turn the circulation fan off during
    # this print. If a dryer cycle is active, transfer heater/fan ownership to
    # PRINT_START without briefly switching the bed off.
    UPDATE_DELAYED_GCODE ID=bed_fan_off_delay DURATION=0
    {% if printer["gcode_macro _DRYER_STATUS"] is defined and printer["gcode_macro _DRYER_STATUS"].is_drying|int == 1 %}
        _DRYER_HANDOFF_TO_PRINT
    {% endif %}

    # 1) Init only. Never toolchange before Z has been homed.
    CLEAR_PAUSE
    BED_MESH_CLEAR
    SET_GCODE_OFFSET X=0 Y=0 Z=0
    G90
    M83
    INITIALIZE_TOOLCHANGER
    _REQUIRE_TOOL_STATE
    SET_GCODE_VARIABLE MACRO=_PRINT_STATE VARIABLE=state VALUE="'starting'"
    SET_GCODE_VARIABLE MACRO=_PRINT_STATE VARIABLE=paused_tool VALUE=-1
    SET_GCODE_VARIABLE MACRO=_PRINT_STATE VARIABLE=used_tool_count VALUE={used.count}
    {% if printer["gcode_macro STOP_CRASH_DETECTION"] is defined %}
        STOP_CRASH_DETECTION
    {% endif %}

    # 2) Heat asynchronously before G28 to save time.
    # Cartographer is fixed on the shuttle, so G28/QGL does not depend on which tool is mounted.
    # Preheat slicer-used tools only to standby. T0 briefly reaches its purge
    # temperature later, then cools back to 150 C before probe contact.
    _SET_LED_STATUS_HEATING
    M117 Heat async bed/tools
    M140 S{BED_TEMP}
    {% for tn in printer.toolchanger.tool_numbers %}
        {% if tn == 0 or used.temps[loop.index0] > 0 %}
            M104 T{tn} S{PROBE_TEMP}
        {% else %}
            M104 T{tn} S0
        {% endif %}
    {% endfor %}

    _SET_LED_STATUS_LEVELING
    M117 Full G28 with Cartographer shuttle

    # 3) Full home first. If the printer is holding T1/T2/T3/T4,
    # homing/QGL still runs with Cartographer on the shuttle.
    G28
    G90
    G0 Z{SAFE_Z} F3000

    # 4) Only switch back to T0 after full G28 and a safe Z raise.
    # QGL waits until bed heat/soak is stable to avoid Cartographer thermal drift.
    _PRINT_START_SELECT_T0
    G90
    G0 Z{SAFE_Z} F3000

    # 5) Bambu-inspired first clean while the bed continues heating:
    # Purge at the slicer's T0 material temperature when T0 has filament,
    # then finish at 150 C. The 40 mm purge includes recovery from the known
    # 10 mm PRINT_END retract and leaves about 30 mm of visible extrusion.
    # An empty enabled T0 sensor selects a dry wipe; no purge temperature is needed.
    _SET_LED_STATUS_CLEANING
    M117 Clean T0
    {% if t0_has_filament %}
        RESPOND TYPE=echo MSG="T0 clean: {T0_MATERIAL} profile, purge at {T0_PURGE_TEMP}C then cool to {PROBE_TEMP}C"
        CLEAN_NOZZLE MODE=DEEP TEMP={PROBE_TEMP} WIPES=3 PURGE=40 PURGE_TEMP={T0_PURGE_TEMP}
    {% else %}
        RESPOND TYPE=echo MSG="T0 clean: filament sensor empty; dry wipe at {PROBE_TEMP}C"
        CLEAN_NOZZLE MODE=DEEP TEMP={PROBE_TEMP} WIPES=3 PURGE=0
    {% endif %}

    # 6) Use the current bed reading after cleaning, not the stale start value.
    # Wait only for a low bed; a bed above target need not cool before QGL.
    M117 Wait for bed near {BED_TEMP}C
    TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={BED_TEMP - 1}
    BED_FAN_ON SPEED=0.5

    _PRINT_START_HEAT_SOAK BED_TEMP={BED_TEMP} BED_START={bed_start} SOAK={SOAK_TIME} AUTO_SOAK={AUTO_SOAK} FULL_BED={FULL_BED}{% if MATERIAL != "" %} MATERIAL={MATERIAL}{% endif %}

    # 7) QGL after bed heat/soak so Cartographer leveling is based on stable
    # bed temperature, not the earlier warm-up state.
    _SET_LED_STATUS_LEVELING
    M117 Stable-temp QGL
    QUAD_GANTRY_LEVEL
    G0 Z{SAFE_Z} F3000

    # 8) Touch home must use stable bed temperature and T0/extruder at <=150 C.
    # The short final wipe removes any plastic oozed during QGL/soak. MODE=TOUCH
    # enforces QGL, zero offsets, no mesh, no purge, and a strict <=150 C wait.
    _SET_LED_STATUS_CLEANING
    M117 Clean T0 before touch
    CLEAN_NOZZLE MODE=TOUCH TEMP={PROBE_TEMP} WIPES=1
    _SET_LED_STATUS_LEVELING
    M117 Cartographer touch home
    CARTOGRAPHER_TOUCH_HOME
    G0 Z{SAFE_Z} F3000

    # 9) Touch-home is complete. Keep used tools at standby except the first
    # tool that PRIME_LINES will purge, which heats during adaptive mesh.
    {% for tn in printer.toolchanger.tool_numbers %}
        {% set tool_section = printer.toolchanger.tool_names[printer.toolchanger.tool_numbers.index(tn)] %}
        {% set standby_temp = printer[tool_section].params_standby_temp|default(PROBE_TEMP)|int %}
        {% if used.temps[loop.index0] > 0 %}
            {% if tn == used.first_t %}
                M104 T{tn} S{used.first_temp}
            {% else %}
                M104 T{tn} S{standby_temp}
            {% endif %}
        {% else %}
            M104 T{tn} S0
        {% endif %}
    {% endfor %}

    _SET_LED_STATUS_LEVELING
    M117 Bed mesh adaptive
    BED_MESH_CALIBRATE ADAPTIVE=1
    M400

    # 10) Prime every slicer-used tool. The initial tool is purged last, so it
    # remains mounted and ready for the first move from the sliced file.
    _SET_LED_STATUS_HEATING
    M117 Prime tools
    PRIME_LINES INITIAL_TOOL={TOOL}{% for tn in printer.toolchanger.tool_numbers %}{% if used.temps[loop.index0] > 0 %} T{tn}_TEMP={used.temps[loop.index0]}{% endif %}{% endfor %}
    {% if printer["gcode_macro START_CRASH_DETECTION"] is defined %}
        START_CRASH_DETECTION
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_PRINT_STATE VARIABLE=state VALUE="'printing'"
    _SET_LED_STATUS_PRINTING
    M117 Printing
############################################################################
# PRINT END - StealthChanger KTC-Easy
############################################################################

[gcode_macro PRINT_END]
description: End print
gcode:
    # Native shutdown is independent of successful retract, lift or docking.
    TURN_OFF_HEATERS
    _STOP_AUXILIARY_HEAT_TASKS
    BED_MESH_CLEAR
    SET_GCODE_OFFSET X=0 Y=0 Z=0
    # ====== RESET PRINT STATE before anything else ======
    SET_GCODE_VARIABLE MACRO=_PRINT_STATE VARIABLE=state VALUE="'idle'"

    # ====== STEP 1: SAFE POSITION ======
    {% set th = printer.toolhead %}
    # Raise Z by at least 10 mm above the printed part, keeping at least 20 mm clearance.
    {% set z_safe = [[th.position.z + 10.0, 20.0]|max, th.axis_maximum.z]|min %}
    {% set z_lift = [z_safe - th.position.z|float, 0.0]|max %}
    {% set recovery = printer["gcode_macro _TOOL_RECOVERY"].required|int if printer["gcode_macro _TOOL_RECOVERY"] is defined else 0 %}
    {% set xyz_homed = "xyz" in th.homed_axes and not recovery and printer.toolchanger.status == "ready" and printer.toolchanger.tool_number|default(-1)|int == printer.toolchanger.detected_tool_number|default(-1)|int %}
    {% set active_extruder = printer.toolhead.extruder|default("")|string %}
    {% set retract_hot = xyz_homed and printer.toolchanger.tool_number|int >= 0 and active_extruder != "" and printer[active_extruder].can_extrude %}
    {% set first_lift = [5.0, z_lift]|min if retract_hot else 0.0 %}

    # ====== STEP 2: RESET SPEED AND FLOW ======
    M220 S100
    M221 S100
    SET_PRESSURE_ADVANCE ADVANCE=0
    {% if printer["gcode_macro STOP_CRASH_DETECTION"] is defined %}
        STOP_CRASH_DETECTION
    {% endif %}

    {% if xyz_homed %}
    # ====== STEP 3: RETRACT + Z LIFT ======
    # Retract the mounted extruder in two stages while lifting at most 5 mm.
    {% if retract_hot %}
        G92 E0
        G91
        G1 E-2.0 F2700              ; Fast 2 mm retract to release pressure
        # Cap the original Z5 stage by physical headroom, including at max Z.
        G1 {% if first_lift > 0 %}Z{first_lift}{% endif %} E-8.0 F12000
        G90
    {% endif %}
    M400
    # Lift above the part before docking; use relative travel with offsets clear.
    G91
    {% if z_lift > first_lift %}
        G0 Z{z_lift - first_lift} F3000
    {% endif %}
    G90

    # Set every tool target to zero before docking, then park the empty shuttle.
    _PRINT_FINISH_DOCK_AND_PARK MIN_Z={z_safe}
    {% else %}
        RESPOND TYPE=echo MSG="[PRINT_END] Motion skipped: XYZ/toolchanger/recovery state is unsafe"
    {% endif %}

    # ====== STEP 6: RESET ANY OFFSET REAPPLIED DURING TOOL DROP ======
    SET_GCODE_OFFSET X=0.0 Y=0.0 Z=0.0

    # KTC can restore standby targets during a change; shut down tools again.
    _PRINT_FINISH_TOOL_SHUTDOWN

    # Schedule chamber circulation fan shutdown after 3 minutes, similar to a Nevermore filter.
    UPDATE_DELAYED_GCODE ID=bed_fan_off_delay DURATION=180

    # ====== STEP 8: CLEANUP ======
    CLEAR_PAUSE

    # ====== STEP 9: REPORT THE RESULT ======
    {% if recovery %}
        _SET_LED_STATUS_ERROR
        M117 Stopped; inspect tool
    {% else %}
        _SET_LED_STATUS_COMPLETE
        M117 Complete
    {% endif %}
    # The job has ended without moving an uncertain tool. A later start checks
    # the physical KTC state again before its first homing move.
    {% if recovery %}
        SET_GCODE_VARIABLE MACRO=_TOOL_RECOVERY VARIABLE=required VALUE=0
    {% endif %}

[gcode_macro _PRINT_FINISH_DOCK_AND_PARK]
description: Dock a verified tool and park the empty shuttle after a safe Z lift
gcode:
    {% set recovery = printer["gcode_macro _TOOL_RECOVERY"].required|int %}
    {% if "xyz" not in printer.toolhead.homed_axes or recovery or printer.toolchanger.status != "ready" or printer.toolchanger.tool_number|default(-1)|int != printer.toolchanger.detected_tool_number|default(-1)|int %}
        {action_raise_error("Finish motion refused: homed XYZ and a verified toolchanger are required")}
    {% endif %}
    # The pickup path can wait on a target; clear every target before docking.
    {% for tn in printer.toolchanger.tool_numbers %}
        M104 S0 T{tn}
    {% endfor %}
    {% if printer.toolchanger.tool_number|default(-1)|int >= 0 %}
        UNSELECT_TOOL RESTORE_AXIS=
    {% endif %}
    _PRINT_FINISH_PARK MIN_Z={params.MIN_Z|default(20)|float}

[gcode_macro _PRINT_FINISH_TOOL_SHUTDOWN]
description: Turn off tool heaters, part fans and extruder steppers after a print
gcode:
    {% for tn in printer.toolchanger.tool_numbers %}
        M104 S0 T{tn}
        {% set name = printer.toolchanger.tool_names[printer.toolchanger.tool_numbers.index(tn)] %}
        {% set tool = printer[name] %}
        {% if tool.fan and ("fan_generic " ~ tool.fan) in printer.configfile.config %}
            SET_FAN_SPEED FAN={tool.fan} SPEED=0
        {% endif %}
        {% if tool.extruder %}
            SET_STEPPER_ENABLE STEPPER={tool.extruder} ENABLE=0
        {% endif %}
    {% endfor %}

[gcode_macro _PRINT_FINISH_PARK]
description: Recheck the empty shuttle and restore physical clearance after docking
gcode:
    {% set th = printer.toolhead %}
    {% if "xyz" not in th.homed_axes or printer.toolchanger.status != "ready" or printer.toolchanger.tool_number|int >= 0 or printer.toolchanger.detected_tool_number|default(-1)|int >= 0 %}
        {action_raise_error("Finish park refused: an empty, ready, homed shuttle is required")}
    {% endif %}
    {% set target_z = [[params.MIN_Z|default(20.0)|float, 20.0]|max, th.axis_maximum.z|float]|min %}
    # No tool transform, mesh or live offset is active here.
    # Move empty shuttle to rear park position at clearance height first, then lower Z to target_z (z_safe).
    SET_GCODE_OFFSET X=0 Y=0 Z=0
    G90
    G0 X{th.axis_maximum.x // 2} Y{th.axis_maximum.y - 20} F9000
    G0 Z{target_z} F3000

############################################################################
# FILAMENT RUNOUT HANDLER
############################################################################

[gcode_macro _FILAMENT_RUNOUT_HANDLE]
description: Handle filament runout with debounce
gcode:
    {% set T = params.T|int %}
    {% set sensor_name = "filament_sensor_T" ~ T %}

    {% if not printer["filament_switch_sensor " ~ sensor_name].filament_detected %}

        # BUG-07 FIX: use printer.toolchanger.tool_number instead of variable_active.
        # KTC-Easy tracks the active tool through printer.toolchanger.tool_number.
        # variable_active in gcode_macro T0/T1 is not updated automatically by KTC-Easy.
        {% set active_tool_number = printer.toolchanger.tool_number|default(-1)|int %}

        {% set is_printing = printer.print_stats.state|default("")|lower == "printing" %}
        {% if active_tool_number == T and is_printing %}
            RESPOND PREFIX="RUNOUT" MSG="T{T}: confirmed after debounce; pausing print"
            _FILAMENT_RUNOUT_PAUSE T={T}
        {% elif active_tool_number == T %}
            RESPOND PREFIX="WARNING" MSG="T{T}: runout detected outside an active print; not pausing"
        {% else %}
            RESPOND PREFIX="WARNING" MSG="T{T}: runout on parked tool; active tool is T{active_tool_number}; not pausing"
        {% endif %}

    {% else %}
        RESPOND MSG="[T{T}] Noise filtered successfully; sensor is normal"
    {% endif %}


[gcode_macro _FILAMENT_RUNOUT_PAUSE]
description: Pause when filament runs out
gcode:
    {% set T = params.T|int %}
    PAUSE X=180 Y=10 Z_MIN=30
    M117 T{T}: Filament runout! Load filament and press RESUME

# RESUME calls this hook only after tool, filament and heater checks succeed.
[gcode_macro _LED_RESUME_WRAPPER]
description: RESUME hook wrapper; set printing LED and schedule delayed sync
gcode:
    SET_GCODE_VARIABLE MACRO=_PRINT_STATE VARIABLE=state VALUE="'printing'"
    {% set t = printer.toolchanger.tool_number|default(-1)|int %}
    {% if t >= 0 %}
        _SET_TOOL_LED T={t} STATE=printing
    {% endif %}
    _SYNC_INACTIVE_LEDS
    {% if printer["gcode_macro START_CRASH_DETECTION"] is defined %}
        START_CRASH_DETECTION
    {% endif %}
    # Safety net: run LED sync again after 1.5 s so after_change_gcode has finished.
    UPDATE_DELAYED_GCODE ID=_RESUME_LED_SYNC DURATION=1.5

# This file supplies the final Mainsail/KTC pause, resume and cancel behavior.
# PAUSE_BASE saves position; RESUME reinitializes and verifies the original
# tool before restoring heat, unretracting and calling RESUME_BASE.
# CANCEL_PRINT_BASE stops the virtual-SD job before optional dock/park motion.
# The three single-macro client hooks are configured in _CLIENT_VARIABLE.

[gcode_macro PAUSE]
description: Pause once with Mainsail parking, or use no-XYZ crash recovery
rename_existing: PAUSE_BASE
gcode:
  {% set recovery = printer["gcode_macro _TOOL_RECOVERY"].required|int %}
  {% if printer.pause_resume.is_paused %}
    RESPOND MSG="Already paused; original tool, temperature and position retained"
  {% elif recovery or printer.toolchanger.status == "error" %}
    _TOOL_CRASH_SAFE_PAUSE
  {% else %}
    # Preserve the installed Mainsail pause contract without editing mainsail.cfg.
    {% set client = printer['gcode_macro _CLIENT_VARIABLE']|default({}) %}
    {% set idle_timeout = client.idle_timeout|default(0) %}
    {% set temp = printer[printer.toolhead.extruder].target if printer.toolhead.extruder != '' else 0 %}
    {% set restore = False if printer.toolhead.extruder == '' else params.RESTORE|default(1)|int == 1 %}
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=last_extruder_temp VALUE="{{'restore': restore, 'temp': temp}}"
    {% if idle_timeout > 0 %}
      SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=restore_idle_timeout VALUE={printer.configfile.settings.idle_timeout.timeout}
      SET_IDLE_TIMEOUT TIMEOUT={idle_timeout}
    {% endif %}
    PAUSE_BASE
    {client.user_pause_macro|default("")}
    _TOOLHEAD_PARK_PAUSE_CANCEL {rawparams}
  {% endif %}

[gcode_macro _PRINT_PAUSED]
description: Record pause lifecycle state independently of LED presentation
gcode:
  {% set ps = printer["gcode_macro _PRINT_STATE"] %}
  {% if ps.state != "paused" %}
    SET_GCODE_VARIABLE MACRO=_PRINT_STATE VARIABLE=paused_tool VALUE={printer.toolchanger.tool_number|default(-1)|int}
  {% endif %}
  SET_GCODE_VARIABLE MACRO=_PRINT_STATE VARIABLE=state VALUE="'paused'"
  _SET_LED_STATUS_PAUSE

[gcode_macro RESUME]
description: Resume print with KTC tool verification and Mainsail safety checks
rename_existing: RESUME_BASE
variable_last_extruder_temp: {'restore': False, 'temp': 0}
variable_restore_idle_timeout: 0
variable_idle_state: False
gcode:
  # KTC-Easy requirement: refresh toolchanger state and confirm that the
  # currently active tool is still detected before motion/extrusion resumes.
  {% if not printer.pause_resume.is_paused %}
    {action_raise_error("RESUME requires a paused print")}
  {% endif %}
  INITIALIZE_TOOLCHANGER
  VERIFY_TOOL_DETECTED
  _RESUME_AFTER_TOOL_CHECK {rawparams}

[gcode_macro _RESUME_AFTER_TOOL_CHECK]
description: Re-evaluate resume conditions after KTC initialization and verification
gcode:
  {% set resume = printer["gcode_macro RESUME"] %}
  {% set idle_state = resume.idle_state %}
  {% set last_extruder_temp = resume.last_extruder_temp %}
  {% set restore_idle_timeout = resume.restore_idle_timeout %}
  _RESUME_CHECK_TOOL_AND_FILAMENT

  ##### get user parameters or use default #####
  {% set client = printer['gcode_macro _CLIENT_VARIABLE']|default({}) %}
  {% set velocity = printer.configfile.settings.pause_resume.recover_velocity %}
  {% set sp_move = client.speed_move|default(velocity) %}
  {% set runout_resume = True if client.runout_sensor|default("") == ""
                    else True if not printer[client.runout_sensor].enabled
                    else printer[client.runout_sensor].filament_detected %}
  {% set can_extrude = True if printer.toolhead.extruder == ''
                  else printer[printer.toolhead.extruder].can_extrude %}
  {% set do_resume = False %}
  {% set prompt_txt = [] %}
  ##### end of definitions #####

  #### Printer coming from timeout idle state ####
  {% if printer.idle_timeout.state|upper == "IDLE" or idle_state %}
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=idle_state VALUE=False
    {% if last_extruder_temp.restore %}
      RESPOND TYPE=echo MSG='{"Restoring \"%s\" temperature to %3.1f\u00B0C, this may take some time" % (printer.toolhead.extruder, last_extruder_temp.temp) }'
      M109 S{last_extruder_temp.temp}
      {% set do_resume = True %}
    {% elif can_extrude %}
      {% set do_resume = True %}
    {% else %}
      RESPOND TYPE=error MSG='{"Resume aborted !!! \"%s\" not hot enough, please heat up again and press RESUME" % printer.toolhead.extruder}'
      {% set _d = prompt_txt.append("\"%s\" not hot enough, please heat up again and press RESUME" % printer.toolhead.extruder) %}
    {% endif %}
  #### Printer coming out of regular PAUSE state ####
  {% elif can_extrude %}
    {% set do_resume = True %}
  {% else %}
    RESPOND TYPE=error MSG='{"Resume aborted !!! \"%s\" not hot enough, please heat up again and press RESUME" % printer.toolhead.extruder}'
    {% set _d = prompt_txt.append("\"%s\" not hot enough, please heat up again and press RESUME" % printer.toolhead.extruder) %}
  {% endif %}

  {% if runout_resume %}
    {% if do_resume %}
      _RESUME_FINALIZE VELOCITY={params.VELOCITY|default(sp_move)}
    {% endif %}
  {% else %}
    RESPOND TYPE=error MSG='{"Resume aborted !!! \"%s\" detects no filament, please load filament and press RESUME" % (client.runout_sensor.split(" "))[1]}'
    {% set _d = prompt_txt.append("\"%s\" detects no filament, please load filament and press RESUME" % (client.runout_sensor.split(" "))[1]) %}
  {% endif %}

  ##### Generate User Information box in case of abort #####
  {% if not (runout_resume and do_resume) %}
    RESPOND TYPE=command MSG="action:prompt_begin RESUME aborted !!!"
    {% for element in prompt_txt %}
      RESPOND TYPE=command MSG='{"action:prompt_text %s" % element}'
    {% endfor %}
    RESPOND TYPE=command MSG="action:prompt_footer_button Ok|RESPOND TYPE=command MSG=action:prompt_end|info"
    RESPOND TYPE=command MSG="action:prompt_show"
  {% endif %}

[gcode_macro _RESUME_CHECK_TOOL_AND_FILAMENT]
description: Check the mounted tool and its enabled filament sensor without motion
gcode:
  {% set t = printer.toolchanger.tool_number|int %}
  {% set expected = printer["gcode_macro _PRINT_STATE"].paused_tool|int %}
  {% if expected < 0 %}
    {action_raise_error("RESUME cannot identify the original paused tool; CANCEL_PRINT safely")}
  {% endif %}
  {% if not printer.pause_resume.is_paused or printer.toolchanger.status != "ready" or t not in printer.toolchanger.tool_numbers or t != expected or "xyz" not in printer.toolhead.homed_axes %}
    {action_raise_error("RESUME requires the original paused tool, detected and ready")}
  {% endif %}
  {% set name = printer.toolchanger.tool_names[printer.toolchanger.tool_numbers.index(t)] %}
  {% if printer[name].extruder != printer.toolhead.extruder %}
    {action_raise_error("RESUME tool/extruder mapping mismatch")}
  {% endif %}
  {% set sensor_name = "filament_switch_sensor filament_sensor_T" ~ t|string %}
  # An explicitly disabled sensor keeps the existing operator override policy.
  {% if printer[sensor_name] is defined and printer[sensor_name].enabled and not printer[sensor_name].filament_detected %}
    {action_raise_error("RESUME refused: load filament into the mounted tool first")}
  {% endif %}

[gcode_macro _RESUME_FINALIZE]
description: Recheck heater and filament after any resume temperature wait
gcode:
  {% set resume = printer["gcode_macro RESUME"] %}
  {% set client = printer["gcode_macro _CLIENT_VARIABLE"] %}
  {% if not printer[printer.toolhead.extruder].can_extrude %}
    {action_raise_error("RESUME refused: mounted extruder is not hot enough")}
  {% endif %}
  {% if client.runout_sensor|default("") != "" and printer[client.runout_sensor].enabled and not printer[client.runout_sensor].filament_detected %}
    {action_raise_error("RESUME refused: the configured client filament sensor is empty")}
  {% endif %}
  _RESUME_CHECK_TOOL_AND_FILAMENT
  # KTC and the original paused tool were verified after the temperature wait.
  SET_GCODE_VARIABLE MACRO=_TOOL_RECOVERY VARIABLE=required VALUE=0
  {% if resume.restore_idle_timeout > 0 %}
    SET_IDLE_TIMEOUT TIMEOUT={resume.restore_idle_timeout}
  {% endif %}
  {client.user_resume_macro|default("")}
  _CLIENT_EXTRUDE
  RESUME_BASE VELOCITY={params.VELOCITY}

[gcode_macro CANCEL_PRINT]
description: Cancel with shutdown first and crash-aware custom cleanup
rename_existing: CANCEL_PRINT_BASE
gcode:
  {% set client = printer["gcode_macro _CLIENT_VARIABLE"]|default({}) %}
  TURN_OFF_HEATERS
  _STOP_AUXILIARY_HEAT_TASKS
  STOP_CRASH_DETECTION
  # Finish native cancellation before optional motion: a dock error must not
  # leave the virtual-SD job active. Mainsail readonly is left untouched.
  {% if printer["gcode_macro RESUME"].restore_idle_timeout > 0 %}
    SET_IDLE_TIMEOUT TIMEOUT={printer["gcode_macro RESUME"].restore_idle_timeout}
  {% endif %}
  SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=idle_state VALUE=False
  SET_PAUSE_NEXT_LAYER ENABLE=0
  SET_PAUSE_AT_LAYER ENABLE=0 LAYER=0
  CANCEL_PRINT_BASE
  {% set recovery = printer["gcode_macro _TOOL_RECOVERY"].required|int if printer["gcode_macro _TOOL_RECOVERY"] is defined else 0 %}
  {% if not recovery and printer.toolchanger.status == "ready" %}
    _CLIENT_RETRACT LENGTH={client.cancel_retract|default(5.0)|abs}
  {% endif %}
  M106 S0
  {client.user_cancel_macro|default("")}

[gcode_macro _STOP_AUXILIARY_HEAT_TASKS]
description: Cancel auxiliary heater callbacks so shutdown cannot be undone
gcode:
  {% if printer["gcode_macro _DRYER_STATUS"] is defined %}
    SET_GCODE_VARIABLE MACRO=_DRYER_STATUS VARIABLE=is_drying VALUE=0
    SET_GCODE_VARIABLE MACRO=_DRYER_STATUS VARIABLE=time_remaining VALUE=0
    UPDATE_DELAYED_GCODE ID=DRYER_TIMER DURATION=0
  {% endif %}
  {% if printer["gcode_macro _TOOL_HEATUP_VARS"] is defined %}
    SET_GCODE_VARIABLE MACRO=_TOOL_HEATUP_VARS VARIABLE=is_running VALUE=0
    UPDATE_DELAYED_GCODE ID=_TOOL_HEATUP_TIMER DURATION=0
  {% endif %}

[gcode_macro _CLIENT_VARIABLE]
# Pause park position
# variable_use_custom_pos  : False        # Use custom park coordinates
# variable_custom_park_x   : 170.0        # X park when paused, bed center
# variable_custom_park_y   : 10.0         # Y park when paused, front
# variable_custom_park_dz  : 5.0          # Additional Z lift in mm when parking
# Retract/Unretract
# variable_retract         : 1.0          # Retract distance during PAUSE, in mm
# variable_cancel_retract  : 5.0          # Retract distance during CANCEL_PRINT, in mm
# variable_speed_retract   : 35.0         # Retract speed in mm/s
# variable_unretract       : 1.0          # Unretract distance during RESUME, in mm
# variable_speed_unretract : 35.0         # Unretract speed in mm/s
# Speed
# variable_speed_hop       : 15.0         # Z-hop speed in mm/s
# variable_speed_move      : 100.0        # XY move speed in mm/s
# Idle timeout during PAUSE
# variable_idle_timeout    : 0            # 0 = do not change idle_timeout
# Runout sensor, full config name
# variable_runout_sensor   : ""           # Example: "filament_switch_sensor runout"
# Hooks; only single macro names are supported
variable_user_pause_macro  : "_PRINT_PAUSED"
variable_user_resume_macro : "_LED_RESUME_WRAPPER"
variable_user_cancel_macro : "_CUSTOM_CANCEL_CLEANUP"
gcode:
    # No gcode; this section only stores config variables.

# Runs after CANCEL_PRINT_BASE and shutdown. A crash or missing homing skips
# every dock/park move; otherwise the shared finish helper parks empty.

[gcode_macro _CUSTOM_CANCEL_CLEANUP]
description: Clean up toolchanger and LEDs when canceling a print through the mainsail CANCEL_PRINT hook
gcode:
    # Mark the print idle before any toolchange so after_change_gcode cannot
    # restore printing LEDs or restart crash detection during cancel cleanup.
    SET_GCODE_VARIABLE MACRO=_PRINT_STATE VARIABLE=state VALUE="'idle'"

    # Reset flow, speed, and pressure.
    M220 S100
    M221 S100
    SET_PRESSURE_ADVANCE ADVANCE=0
    # CANCEL_PRINT has already stopped detection and switched heaters off.
    BED_MESH_CLEAR
    SET_GCODE_OFFSET X=0 Y=0 Z=0
    {% set recovery = printer["gcode_macro _TOOL_RECOVERY"].required|int if printer["gcode_macro _TOOL_RECOVERY"] is defined else 0 %}
    # Only move if XYZ has been homed and attachment has not been questioned.
    {% if "xyz" in printer.toolhead.homed_axes and not recovery and printer.toolchanger.status == "ready" and printer.toolchanger.tool_number|default(-1)|int == printer.toolchanger.detected_tool_number|default(-1)|int %}
        {% set th = printer.toolhead %}

        # Safe Z lift: at least 10 mm above part, min 20 mm clearance, never above max_z.
        {% set z_now  = th.position.z|float %}
        {% set z_safe = [[z_now + 10.0, 20.0]|max, th.axis_maximum.z|float]|min %}
        G91
        {% if z_safe > z_now %}
            G0 Z{z_safe - z_now} F3000
        {% endif %}
        G90

        _PRINT_FINISH_DOCK_AND_PARK MIN_Z={z_safe}

    {% else %}
        # XYZ is not homed: skip toolchange because dropoff/pickup needs a valid Z-hop position.
        RESPOND TYPE=echo MSG="[CANCEL] Motion skipped: XYZ/toolchanger/recovery state is unsafe"
        {% if recovery %}
            RESPOND TYPE=error MSG="[CANCEL] Tool crash: no parking motion; inspect the dock/tool before another print"
        {% endif %}
    {% endif %}

    _PRINT_FINISH_TOOL_SHUTDOWN

    # Clean up print state.
    CLEAR_PAUSE
    SET_GCODE_OFFSET X=0 Y=0 Z=0
    # Match PRINT_END: keep chamber circulation briefly, then stop it. A future
    # PRINT_START/START_DRYER explicitly cancels this callback before taking
    # ownership of the fan.
    UPDATE_DELAYED_GCODE ID=bed_fan_off_delay DURATION=180

    # This helper renders after UNSELECT_TOOL has completed, so it sees
    # the real final active tool instead of the pre-toolchange macro snapshot.
    _CANCEL_LED_FINALIZE
    # Cancellation has finished without motion under the crash guard. The next
    # PRINT_START reinitializes and verifies KTC before homing.
    {% if recovery %}
        SET_GCODE_VARIABLE MACRO=_TOOL_RECOVERY VARIABLE=required VALUE=0
    {% endif %}
    M117 Print canceled.

