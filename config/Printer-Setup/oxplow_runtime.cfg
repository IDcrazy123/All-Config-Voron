# ============================================================================
# OXPLOW_RUNTIME.CFG - Runtime checks for Oxplow first-layer G-code
# Purpose: Register _OXPLOW_CHECK so generated tests verify this printer/profile
# before start, after tool selection and immediately before printing each patch.
# Loading: Enable its optional include in printer.cfg before generated Oxplow G-code.
# Use the matching generator/runtime release; the current runtime version is 2.3.2.
#
# Installation check (safe to call without homing or heating):
#   _OXPLOW_CHECK VERSION=2.3.2 STAGE=install
# This confirms the installed version only. Other stages are generated from the
# reviewed Oxplow profile and require the complete parameters emitted by that tool.
#
# Generated stages:
#   config   - Check version, nozzle/filament, heater definitions and requested
#              temperature/extrusion/speed/lift limits; check saved tool Z when supplied.
#   ready    - Repeat config checks and require XYZ homed after the start macro.
#   selected - Also require the selected tool/extruder after the pickup macro.
#   print    - Also require extrusion temperature, nozzle/bed temperature tolerance,
#              G90/M83 modes and the expected tool; report the current Z baseline.
# Keep these calls separate from start/select macros so they read the resulting state.
#
# The generator first sets preflight_token through native SET_GCODE_VARIABLE to
# fail before start if the macro/variable is absent. It is a volatile presence check.
# Print generated G-code as a virtual-SD file; do not paste/stream it line by line.
# Normal calls supply VERSION/STAGE/EXTRUDER, NOZZLE/FILAMENT, TEMP/BED/TOL,
# AREA (mm^2), RETRACT/LIFT (mm), RSPEED/SPEED/ZSPEED (mm/s).
# Optional TOOL/SAVED_Z pin the expected KTC mapping and saved tool-offset baseline.
#
# Operation: Reads printer state, reports information and raises errors on mismatch.
# Machine-specific homing, tool pickup and priming run through profile macros.
# Generated G-code also sets/waits for temperatures and shuts heaters down.
# The generator owns patch paths and initial-retract recovery from its profile.
# Stored offsets remain printer-owned; this macro neither applies them again nor saves them.
# Review/regenerate the machine profile after nozzle, tool mapping or saved-Z changes.
# Local setup: Include path and the matching profile; retain the checked runtime logic.
# Docs: extras/Printables-Package/README.md and INTEGRATION.md in the repository.
# The published upstream copy remains unchanged; this production copy adds file guidance.
# ============================================================================

# Installation: extras/Printables-Package/upstream-2.3.2/docs/INSTALL_KLIPPER.md.
# This macro does not home, move, heat or save offsets.
[gcode_macro _OXPLOW_CHECK]
description: Validate Oxplow calibration prerequisites without moving
variable_oxplow_version: "2.3.2"
variable_preflight_token: 0
gcode:
    {% if params.VERSION|default("") != printer["gcode_macro _OXPLOW_CHECK"].oxplow_version %}
        {action_raise_error("Oxplow: generator/runtime version mismatch; update oxplow_runtime.cfg")}
    {% endif %}
    {% if params.STAGE|default("config") == "install" %}
        {action_respond_info("Oxplow 2.3.2 runtime installed; no motion or heating was performed")}
    {% else %}
    {% set ext = params.EXTRUDER %}
    {% set c = printer.configfile.settings %}
    {% set stage = params.STAGE|default("config") %}
    {% if "SAVED_Z" in params %}
        {% set tc = printer.toolchanger|default(none) %}
        {% set ident = params.TOOL|int %}
        {% if tc is none or ident not in tc.tool_numbers %}
            {action_raise_error("Oxplow: saved offset reference requires the expected tool registry")}
        {% endif %}
        {% set name = tc.tool_names[tc.tool_numbers.index(ident)] %}
        {% set tool = printer[name] %}
        {% if tool.extruder != ext or (tool.gcode_z_offset|float - params.SAVED_Z|float)|abs > 0.0001 %}
            {action_raise_error("Oxplow: tool mapping/Z offset changed; rediscover and review profile")}
        {% endif %}
        {% if name|lower in c and c[name|lower].gcode_z_offset is defined and (c[name|lower].gcode_z_offset|float - params.SAVED_Z|float)|abs > 0.0001 %}
            {action_raise_error("Oxplow: runtime and saved tool Z differ; review the offset baseline")}
        {% endif %}
        {% if stage in ["selected", "print"] and (tc.tool_number != ident or not tool.active) %}
            {action_raise_error("Oxplow: expected tool is not active")}
        {% endif %}
        {% if stage == "print" %}
            {action_respond_info("Oxplow tool T%d saved/runtime tool_Z=%.5f; printer applies this offset; generator does not add it" % (ident, tool.gcode_z_offset|float))}
        {% endif %}
    {% endif %}
    {% if ext not in c or "heater_bed" not in c %}
        {action_raise_error("Oxplow: extruder or heated bed missing")}
    {% endif %}
    {% set nozzle = c[ext].nozzle_diameter|float %}
    {% set filament = c[ext].filament_diameter|float %}
    {% set max_area = c[ext].max_extrude_cross_section|default(4.0 * nozzle * nozzle)|float %}
    {% set default_e_speed = c.printer.max_velocity|float * 4.0 * nozzle * nozzle / (3.141592653589793 * filament * filament / 4.0) %}
    {% set max_e_speed = c[ext].max_extrude_only_velocity|default(default_e_speed)|float %}
    {% if (nozzle - params.NOZZLE|float)|abs > 0.0001 or (filament - params.FILAMENT|float)|abs > 0.0001 %}
        {action_raise_error("Oxplow: nozzle/filament differs from profile")}
    {% endif %}
    {% if params.TEMP|float + params.TOL|float >= c[ext].max_temp|float or params.TEMP|float - params.TOL|float <= c[ext].min_extrude_temp|default(170)|float %}
        {action_raise_error("Oxplow: nozzle temperature outside printer limits")}
    {% endif %}
    {% if params.BED|float + params.TOL|float >= c.heater_bed.max_temp|float %}
        {action_raise_error("Oxplow: bed temperature outside printer limits")}
    {% endif %}
    {% if params.AREA|float > max_area + 0.000001 or params.RETRACT|float > c[ext].max_extrude_only_distance|default(50)|float or params.RSPEED|float > max_e_speed %}
        {action_raise_error("Oxplow: extrusion/retraction exceeds printer limit")}
    {% endif %}
    {% if params.SPEED|float > c.printer.max_velocity|float or params.ZSPEED|float > c.printer.max_z_velocity|default(c.printer.max_velocity)|float %}
        {action_raise_error("Oxplow: requested speed exceeds printer limits")}
    {% endif %}
    {% if params.LIFT|float > printer.toolhead.axis_maximum.z or params.LIFT|float < printer.toolhead.axis_minimum.z %}
        {action_raise_error("Oxplow: lift outside Z axis bounds")}
    {% endif %}
    {% if stage in ["ready", "selected", "print"] %}
        {% if "x" not in printer.toolhead.homed_axes or "y" not in printer.toolhead.homed_axes or "z" not in printer.toolhead.homed_axes %}
            {action_raise_error("Oxplow: XYZ must be homed")}
        {% endif %}
    {% endif %}
    {% if stage in ["selected", "print"] and printer.toolhead.extruder != ext %}
        {action_raise_error("Oxplow: tool selection activated wrong extruder")}
    {% endif %}
    {% if stage == "print" %}
        {% if not printer[ext].can_extrude or (printer[ext].temperature|float - params.TEMP|float)|abs > params.TOL|float or (printer.heater_bed.temperature|float - params.BED|float)|abs > params.TOL|float %}
            {action_raise_error("Oxplow: nozzle/bed not at calibration temperature")}
        {% endif %}
        {% if printer.gcode_move.absolute_extrude or not printer.gcode_move.absolute_coordinates %}
            {action_raise_error("Oxplow: requires G90 and M83")}
        {% endif %}
        {action_respond_info("Oxplow baseline extruder=%s runtime_Z=%.5f" % (ext, printer.gcode_move.homing_origin.z|float))}
    {% endif %}
    {% endif %}
