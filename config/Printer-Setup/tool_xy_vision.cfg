# ============================================================================
# Tool-XY-Vision — Configuration / Cau Hinh Căn Chinh Camera Vision
# Klipper-Camera-Vision: https://github.com/IDcrazy123/Klipper-Camera-Vision
# ============================================================================

[tool_xy_vision]
# URL cua dich vu thi giac chay ngam (cong 8085)
server_url: http://127.0.0.1:8085

# Endpoint snapshot camera tu camera-streamer (Crowsnest cam 1 tren port 8080)
camera_url: http://127.0.0.1:8080/snapshot

# Tool tham chieu lam goc toa do
reference_tool: auto

# Toc do di chuyen (mm/s)
move_speed: 50.0
fine_move_speed: 5.0
z_speed: 10.0

# Toa do tiep can camera huong len tren ban in (an toan tai 170:0:40)
camera_x: 170.0
camera_y: 0.0
camera_z: 40.0

# Cao do Z an toan (mm)
safe_z: 40.0
safe_z_lift: 5.0
settle_time: 0.5

# Tham so can tam vong kin
max_center_iterations: 3
coarse_step_limit: 5.0
fine_step_limit: 0.5
center_tolerance_mm: 0.02
center_tolerance_px: 1.5

# Kiem soat chat luong anh chup burst
burst_frames: 3
min_inlier_frames: 2
min_confidence: 0.6

# An toan nhiet do dau in (do nguoi khi khong gia nhiet)
max_extruder_temp: 100.0
enable_wiggle_recovery: True
wiggle_distance_mm: 0.1
