[probe_eddy_current ldc1612_eddy_coil]
sensor_type: ldc1612
i2c_mcu: nll36
i2c_software_scl_pin: nll36:PB6   # i2c 接口的scl pin名
i2c_software_sda_pin: nll36:PB7   # i2c 接口的sda pin名
i2c_address: 42
max_sensor_hz: 12000000
x_offset: 0
y_offset: 18
descend_z: 0.5
reg_drive_current: 21 #20

[led status_led]
white_pin: nll36:PC13
cycle_time: 0.08

[temperature_probe ldc1612_eddy_coil]
sensor_type: Generic 3950
sensor_pin: nll36:PB1
horizontal_move_z: 2
calibration_bed_temp: 60

[safe_z_home]
home_xy_position: 150, 137
z_hop: 20
z_hop_speed: 25
speed: 60

[gcode_macro EDDY_SETUP_AUTO]
gcode:
	G28 X Y
	G1 X{ printer.toolhead.axis_maximum.x/2 } Y{ printer.toolhead.axis_maximum.y/2 } F6000
    set_kinematic_position X={ printer.toolhead.axis_maximum.x/2 } Y={ printer.toolhead.axis_maximum.y/2 } Z=100
    PROBE_EDDY_CURRENT_CALIBRATE CHIP=ldc1612_eddy_coil

[gcode_macro Z_TILT_ADJUST]
rename_existing: _Z_TILT_ADJUST
gcode:
    SET_LED LED=status_led WHITE=0.5
    G90
    G1 X{ printer.toolhead.axis_maximum.x/2 } Y{ printer.toolhead.axis_maximum.y/2 } F6000
    SAVE_GCODE_STATE NAME=STATE_Z_TILT
    BED_MESH_CLEAR
    {% if not printer.z_tilt.applied %}
      _Z_TILT_ADJUST HORIZONTAL_MOVE_Z=8 RETRY_TOLERANCE=0.7
    {% endif %}
    _Z_TILT_ADJUST HORIZONTAL_MOVE_Z=2
    RESTORE_GCODE_STATE NAME=STATE_Z_TILT
    G1 X{ printer.toolhead.axis_maximum.x - 10 } Y{ printer.toolhead.axis_maximum.y - 10 } F6000
    SET_LED LED=status_led WHITE=0

# rapid bed mesh calibrate for default bed mesh calibrate
[gcode_macro BED_MESH_CALIBRATE]
rename_existing: BED_MESH_CALIBRATE_ORIG
gcode:
    {% if not printer.z_tilt.applied %}
      Z_TILT_ADJUST
    {% endif %}
  SET_LED LED=status_led WHITE=0.5
  BED_MESH_CLEAR
  BED_MESH_CALIBRATE_ORIG {rawparams} METHOD=rapid_scan HORIZONTAL_MOVE_Z=2
  SET_LED LED=status_led WHITE=0
