# Individual sharing: one physical KTC tool T1; EBB36 V1.2 wiring reference.
# Requires an existing KTC toolchanger + SELECT_TOOL, [respond], [pause_resume],
# print_stats and a receiver-provided PAUSE implementation. Include once via your
# existing tools glob OR an explicit include, never both. Copy all callbacks.
# To renumber: replace T1, EBB1, tool_number and this tool's extruder section/
# references consistently (T0 normally uses extruder; Tn uses extruderN). Check
# collisions with the receiver's existing tool, MCU, fan, sensor and LED names.
# Native extruder suffixes are independent of KTC numbers: registry mapping wins.
# CAN UUID/pins/driver current/rotation distance/sensor limits/dock XYZ are local
# hardware values, not defaults for other boards. Replace only after verifying.
# Heater PID/control and measured tool offsets are in printer.cfg SAVE_CONFIG
# on this machine; copying this file DOES NOT include them. Keep/calibrate yours.
# Runout uses the project handler when present, otherwise pauses only if this
# tool is active, still empty after debounce, and printing. Never pauses a docked
# inactive tool. Custom PAUSE must handle safe retract/park for your machine.
# Tn_LED has 3 pixels; project LED helpers expect logo=1 and nozzle=2/3.

############################################################################
# T1.cfg - Toolhead 1 (EBB36 V1.2) - KTC-Easy / OrcaSlicer Multi-Color
#
# Board  : BIGTREETECH EBB36 V1.2 (STM32G0B1, CAN bus)
# Hotend : TZ V6 2.0  |  Extruder: WW BMG
# Tool   : T1; Axiscope supplies reviewed XY and first-layer tests finalize Z.
#          Production offsets are preserved in printer.cfg SAVE_CONFIG.
#
# Official documentation:
#   https://stealthchanger.com/software/ktc-easy/examples/#ebb36-v12-t1-non-tap
############################################################################

############################################################################
# MCU
############################################################################

[mcu EBB1]
# Board identity: use the UUID discovered on YOUR CAN network; not a pin number.
canbus_uuid: 6475b5b9e028
canbus_interface: can0

############################################################################
# ADXL345 - Input Shaper
############################################################################

[adxl345 T1]
cs_pin: EBB1:PB12
spi_software_sclk_pin: EBB1:PB10
spi_software_mosi_pin: EBB1:PB11
spi_software_miso_pin: EBB1:PB2
axes_map: x,z,-y

############################################################################
# EXTRUDER1 - WW BMG + TZ V6 2.0
############################################################################

[extruder1]
step_pin: EBB1:PD0
dir_pin: !EBB1:PD1
enable_pin: !EBB1:PD2
heater_pin: EBB1:PB13
sensor_pin: EBB1:PA3
sensor_type: Generic 3950

microsteps: 16
# Effective motor travel/filament per rotation, mm; retain your measured gearing.
rotation_distance: 22.50
gear_ratio: 50:10
full_steps_per_rotation: 200

nozzle_diameter: 0.400
filament_diameter: 1.750
min_temp: 0
max_temp: 290
max_extrude_only_distance: 101

# pressure_advance: 0.03  # Calibrate and uncomment after measuring.
# control/pid_kp/ki/kd are not declared here; SAVE_CONFIG writes them after PID_CALIBRATE.

############################################################################
# TMC2209
############################################################################

[tmc2209 extruder1]
uart_pin: EBB1:PA15
# RMS amperes: use this motor/driver's verified current, not the example blindly.
run_current: 0.6
stealthchop_threshold: 0

############################################################################
# FANS
############################################################################

[heater_fan T1_hotend_fan]
pin: EBB1:PA0
heater: extruder1
heater_temp: 50.0

[fan_generic T1_part_fan]
pin: EBB1:PA1

############################################################################
# TOOL DEFINITION - KTC-Easy
############################################################################

[tool T1]
tool_number: 1
extruder: extruder1
fan: T1_part_fan
# Tool presence input: ^ pull-up, ! inversion; confirm mounted/docked polarity.
detection_pin: ^!EBB1:PB6

# Dock position in nozzle coordinates; must be aligned on the real machine.
# Absolute dock nozzle XYZ, mm; verify with these relative pickup/dropoff paths.
params_park_x: 104 #103.5
params_park_y: 1.5 #1.1
params_park_z: 343

# Standby temperature while parked; KTC manages this automatically after each dropoff.
params_standby_temp: 150
params_heater_standby_delay: 0.1

# Unified shuttle calibration from Cartographer ADXL345 (2026-09-03).
# Frequency overrides are commented out. Verify effective damping in the
# after_change_gcode hook: inherited KTC damping 0.1 can still override global values.
# params_input_shaper_freq_x: 43.6
# params_input_shaper_type_x: 'mzv'
# params_input_shaper_damping_ratio_x: 0.124
# params_input_shaper_freq_y: 33.4
# params_input_shaper_type_y: 'mzv'
# params_input_shaper_damping_ratio_y: 0.080

############################################################################
# NEOPIXEL - 3x WS2812
############################################################################

[neopixel T1_LED]
pin: EBB1:PD3
color_order: GRB
chain_count: 3
initial_RED: 0.5
initial_GREEN: 0.5
initial_BLUE: 0.5

############################################################################
# GCODE MACRO T1 - KTC-Easy; do not change the variable structure.
############################################################################

[gcode_macro T1]
description: Mount toolhead T1
variable_active: 0
variable_color: ""
gcode:
    SELECT_TOOL T=1

############################################################################
# FILAMENT SENSOR
############################################################################

[filament_switch_sensor filament_sensor_T1]
# Runout switch polarity/pull-up: verify filament_detected with and without filament.
switch_pin: ^EBB1:PB9
pause_on_runout: False
event_delay: 0.5
pause_delay: 0.5
runout_gcode:
    UPDATE_DELAYED_GCODE ID=_FILTER_RUNOUT_T1 DURATION=0.5
    RESPOND MSG="[T1] Filament sensor reports runout; waiting for confirmation..."
insert_gcode:
    UPDATE_DELAYED_GCODE ID=_FILTER_RUNOUT_T1 DURATION=0
    RESPOND MSG="[T1] Filament sensor recovered; canceling debounce counter"

[delayed_gcode _FILTER_RUNOUT_T1]
gcode:
    {% if printer["gcode_macro _FILAMENT_RUNOUT_HANDLE"] is defined %}
        _FILAMENT_RUNOUT_HANDLE T=1
    {% else %}
        # Standalone fallback: retain debounce and ignore parked/inactive tools.
        # Native pause_resume and the user's PAUSE macro own the park/retract.
        {% if printer.print_stats is not defined or printer.pause_resume is not defined %}
            {action_raise_error("Tool runout fallback requires print_stats and pause_resume")}
        {% endif %}
        {% if not printer["filament_switch_sensor filament_sensor_T1"].filament_detected and printer.toolchanger.tool_number|int == 1 and printer.print_stats.state|lower == "printing" and not printer.pause_resume.is_paused %}
            PAUSE
        {% endif %}
    {% endif %}
