# Individual sharing: standalone heater benchmark on an existing KTC machine.
# Include once: [include tool-temp-bench.cfg] (adjust path to the copied file).
# Requires KTC tool_numbers/tool_names + tool.extruder, configured heaters,
# [virtual_sdcard]/print_stats, [pause_resume], and [respond]. No new hardware.
# Public: MEASURE_TOOL_HEATUP, STOP_TOOL_HEATUP, BENCH_TOOL_TEMP (alias).
# Tool numbers come from the registry, including sparse numbering.
# Cleaner/LED/dryer/project state are optional. Without CLEAN_NOZZLE, no park
# is requested by default. PARK_BUCKET=0 always avoids automatic station moves.
# To park elsewhere: PARK_BUCKET=1 PARK_X=... PARK_Y=... PARK_Z=... (all mm).
# Parking requires homed XYZ, the selected tool mounted, zero G-code offsets
# and a physically clear route. Limits checks do not establish dock clearance.
# Copy the entire file, including private helpers/timer; do not duplicate names.
# Elapsed time accumulates callback ticks; queued motion/waits can delay results.
# STOP during a wait cannot remove already queued preparation commands; it
# prevents the continuation from arming measurement after those commands finish.

############################################################################
# TOOL-TEMP-BENCH.CFG - Measure hotend heating time from Temp A to Temp B
#
# Voron 2.4 StealthChanger 5-Tool
#
# Measures hotend heating rate and elapsed time for any registered KTC tool.
# Useful for:
#   - Verifying heater cartridge wattage & health across tools
#   - Benchmarking PID response and thermal performance
#   - Detecting degraded heater cartridges or loose thermistors
#
# HOW TO CALL:
#   MEASURE_TOOL_HEATUP                                ; Active tool (or first registered), 150C -> 220C
#   MEASURE_TOOL_HEATUP TOOL=1                         ; T1, 150C -> 220C
#   MEASURE_TOOL_HEATUP TOOL=2 START=150 TARGET=240    ; T2, 150C -> 240C
#   MEASURE_TOOL_HEATUP TEMP_A=160 TEMP_B=230          ; Custom range A -> B
#   BENCH_TOOL_TEMP TOOL=0 START_TEMP=150 TARGET_TEMP=220 ; Alias call
#   STOP_TOOL_HEATUP                                   ; Abort running measurement
############################################################################

############################################################################
# _TOOL_HEATUP_VARS - Internal state storage for heating benchmark
############################################################################

[gcode_macro _TOOL_HEATUP_VARS]
description: Storage variables for heating benchmark
variable_is_running: 0
variable_tool: 0
variable_extruder: "extruder"
variable_start_temp: 150.0
variable_target_temp: 220.0
variable_timeout: 180.0
variable_elapsed: 0.0
variable_cooldown: 1
variable_tick: 0.5
gcode:
    # Storage only; no gcode.


############################################################################
# MEASURE_TOOL_HEATUP
# FLOW:
#   1. Validate parameters (tool number, temperature bounds).
#   2. Optional high-Z park using CLEAN_NOZZLE station coordinates if the active tool is mounted.
#   3. Pre-heat or cool to START_TEMP and dwell 3 s for thermal stabilization.
#   4. Command heater to TARGET_TEMP and arm delayed_gcode timer.
#   5. Live ticker measures elapsed time and reports completion statistics.
############################################################################

[gcode_macro MEASURE_TOOL_HEATUP]
description: Benchmark heating time of a toolhead hotend from Temp A to Temp B
gcode:
    # ----------------------------------------------------------------------
    # 1. Parameter extraction with convenient aliases
    # ----------------------------------------------------------------------
    {% set active_t = printer.toolchanger.tool_number|default(-1)|int %}
    {% set fallback_t = active_t if active_t >= 0 else printer.toolchanger.tool_numbers[0] %}
    {% set target_tool = params.TOOL|default(params.T|default(fallback_t))|int %}

    {% set start_temp = params.START_TEMP|default(params.TEMP_A|default(params.START|default(params.A|default(150.0))))|float %}
    {% set target_temp = params.TARGET_TEMP|default(params.TEMP_B|default(params.TARGET|default(params.B|default(220.0))))|float %}
    {% set timeout = params.TIMEOUT|default(180.0)|float %}
    {% set cooldown = params.COOLDOWN|default(1)|int %}

    # Parking is optional. Without CLEAN_NOZZLE, no implicit station exists.
    # For an independent station use PARK_BUCKET=1 PARK_X=... PARK_Y=... PARK_Z=...
    # on this call; all three values are required together and are G-code mm.
    {% set travel_f =  9000 %}
    {% set z_f      =  1500 %}

    # Preserve existing station behavior when the cleaner is installed.
    {% set has_station = printer["gcode_macro CLEAN_NOZZLE"] is defined %}
    {% set default_park = 1 if (has_station and active_t == target_tool and "xyz" in printer.toolhead.homed_axes) else 0 %}
    {% set park_bucket = params.PARK_BUCKET|default(default_park)|int %}

    # ----------------------------------------------------------------------
    # 2. Input validation & safety guards
    # ----------------------------------------------------------------------
    {% if printer.print_stats is not defined or printer.pause_resume is not defined %}
        {action_raise_error("MEASURE_TOOL_HEATUP requires print_stats and pause_resume safety state")}
    {% endif %}
    {% if printer.print_stats.state is not defined or printer.pause_resume.is_paused is not defined or printer.print_stats.state|lower not in ["standby", "complete", "cancelled", "error", "printing", "paused"] %}
        {action_raise_error("MEASURE_TOOL_HEATUP: printer safety state is unavailable or unknown")}
    {% endif %}
    {% set ps = printer["gcode_macro _PRINT_STATE"].state|string|lower if printer["gcode_macro _PRINT_STATE"] is defined else "idle" %}
    {% if printer.print_stats.state|default("unknown")|lower not in ["standby", "complete", "cancelled", "error"] or printer.pause_resume.is_paused|default(true) or ps not in ["idle"] %}
        {action_raise_error("MEASURE_TOOL_HEATUP: Finish or cancel the print before benchmarking.")}
    {% elif printer["gcode_macro _DRYER_STATUS"] is defined and printer["gcode_macro _DRYER_STATUS"].is_drying|int == 1 %}
        {action_raise_error("MEASURE_TOOL_HEATUP: Stop the dryer before benchmarking.")}
    {% elif target_tool not in printer.toolchanger.tool_numbers %}
        {action_raise_error("MEASURE_TOOL_HEATUP: TOOL is not registered with the toolchanger.")}
    {% elif timeout <= 0 or cooldown not in [0, 1] or park_bucket not in [0, 1] %}
        {action_raise_error("MEASURE_TOOL_HEATUP: TIMEOUT must be positive; COOLDOWN and PARK_BUCKET must be 0 or 1.")}
    {% endif %}

    # Tool number is a key, not a list index; support sparse numbers and custom names.
    {% set tool_name = printer.toolchanger.tool_names[printer.toolchanger.tool_numbers.index(target_tool)] %}
    {% set target_extruder = printer[tool_name].extruder %}
    {% if not target_extruder %}
        {action_raise_error("MEASURE_TOOL_HEATUP: The selected tool has no extruder heater.")}
    {% endif %}
    {% set heater_max = printer.configfile.settings[target_extruder].max_temp|float %}

    {% if start_temp < 30.0 %}
        {action_raise_error("MEASURE_TOOL_HEATUP: START_TEMP (" ~ start_temp|string ~ "C) is too low. Must be >= 30C.")}
    {% endif %}

    {% if target_temp >= heater_max %}
        {action_raise_error("MEASURE_TOOL_HEATUP: TARGET_TEMP must be below this heater max_temp of %.1fC." % heater_max)}
    {% endif %}

    {% if target_temp <= start_temp %}
        {action_raise_error("MEASURE_TOOL_HEATUP: TARGET_TEMP (" ~ target_temp|string ~ "C) must be greater than START_TEMP (" ~ start_temp|string ~ "C).")}
    {% endif %}


    # Check if a benchmark is already in progress
    {% if printer["gcode_macro _TOOL_HEATUP_VARS"].is_running == 1 %}
        {action_raise_error("MEASURE_TOOL_HEATUP: A heating benchmark is already active. Run STOP_TOOL_HEATUP first.")}
    {% endif %}

    {% if park_bucket == 1 %}
        {% if target_tool != active_t or "xyz" not in printer.toolhead.homed_axes %}
            {action_raise_error("MEASURE_TOOL_HEATUP: park requires the selected tool already active and XYZ homed")}
        {% endif %}
        {% set explicit_park = params.PARK_X is defined or params.PARK_Y is defined or params.PARK_Z is defined %}
        {% if explicit_park %}
            {% if params.PARK_X is not defined or params.PARK_Y is not defined or params.PARK_Z is not defined %}
                {action_raise_error("MEASURE_TOOL_HEATUP: provide PARK_X, PARK_Y and PARK_Z together")}
            {% endif %}
            {% set bucket_x = params.PARK_X|float %}
            {% set bucket_y = params.PARK_Y|float %}
            {% set safe_z = params.PARK_Z|float %}
        {% elif has_station %}
            {% set station = printer["gcode_macro CLEAN_NOZZLE"] %}
            {% set bucket_x = station.purge_x|float %}
            {% set bucket_y = station.purge_y|float %}
            {% set safe_z = station.safe_z|float %}
        {% else %}
            {action_raise_error("MEASURE_TOOL_HEATUP: no station; use PARK_BUCKET=0 or supply PARK_X/Y/Z")}
        {% endif %}
        {% set origin = printer.gcode_move.homing_origin %}
        {% if origin.x|abs > 0.001 or origin.y|abs > 0.001 or origin.z|abs > 0.001 %}
            {action_raise_error("MEASURE_TOOL_HEATUP: station parking requires zero G-code offsets; use PARK_BUCKET=0")}
        {% endif %}
        {% if bucket_x < printer.toolhead.axis_minimum.x or bucket_x > printer.toolhead.axis_maximum.x or bucket_y < printer.toolhead.axis_minimum.y or bucket_y > printer.toolhead.axis_maximum.y or safe_z <= 0 or safe_z > printer.toolhead.axis_maximum.z %}
            {action_raise_error("MEASURE_TOOL_HEATUP: park point is outside configured travel")}
        {% endif %}
    {% endif %}

    # Claim ownership before parking/preheat waits, so other installed operations
    # can refuse a competing start. STOP_TOOL_HEATUP also works during preparation.
    SET_GCODE_VARIABLE MACRO=_TOOL_HEATUP_VARS VARIABLE=tool VALUE={target_tool}
    SET_GCODE_VARIABLE MACRO=_TOOL_HEATUP_VARS VARIABLE=extruder VALUE="'{target_extruder}'"
    SET_GCODE_VARIABLE MACRO=_TOOL_HEATUP_VARS VARIABLE=is_running VALUE=1

    # ----------------------------------------------------------------------
    # 3. Positioning (if active tool and PARK_BUCKET requested)
    # ----------------------------------------------------------------------
    {% if target_tool == active_t and park_bucket == 1 %}
        SAVE_GCODE_STATE NAME=heatup_bench_park_state
        G90
        {% if printer["gcode_macro _SET_LED_STATUS_CLEANING"] is defined %}
            _SET_LED_STATUS_CLEANING
        {% endif %}
        M117 Moving T{target_tool} to bucket...
        G1 Z{[printer.toolhead.position[2], safe_z]|max} F{z_f}
        G1 X{bucket_x} Y{bucket_y} F{travel_f}
        RESTORE_GCODE_STATE NAME=heatup_bench_park_state
    {% elif target_tool != active_t %}
        RESPOND TYPE=echo MSG="[HEAT_BENCH] Note: T{target_tool} is currently docked. Benchmarking in dock without motion."
    {% endif %}

    # ----------------------------------------------------------------------
    # 4. Thermal stabilization at START_TEMP
    # ----------------------------------------------------------------------
    {% set cur_temp = printer[target_extruder].temperature %}
    RESPOND TYPE=echo MSG="[HEAT_BENCH] T{target_tool} ({target_extruder}) current temp: {cur_temp|round(1)}C. Target start: {start_temp}C."

    {% if cur_temp < (start_temp - 1.0) %}
        {% if printer["gcode_macro _SET_TOOL_LED"] is defined %}
            _SET_TOOL_LED T={target_tool} STATE=heating
        {% endif %}
        M117 Preheating T{target_tool} to {start_temp|int}C...
        RESPOND TYPE=echo MSG="[HEAT_BENCH] Pre-heating to {start_temp}C baseline..."
        SET_HEATER_TEMPERATURE HEATER={target_extruder} TARGET={start_temp}
        TEMPERATURE_WAIT SENSOR={target_extruder} MINIMUM={start_temp - 0.5}
        M117 Soaking at {start_temp|int}C (3s)...
        G4 P3000
    {% elif cur_temp > (start_temp + 3.0) %}
        {% if printer["gcode_macro _SET_TOOL_LED"] is defined %}
            _SET_TOOL_LED T={target_tool} STATE=ready
        {% endif %}
        M117 Cooling T{target_tool} to {start_temp|int}C...
        RESPOND TYPE=echo MSG="[HEAT_BENCH] Hotend is above start temp. Waiting for cooldown to {start_temp}C..."
        SET_HEATER_TEMPERATURE HEATER={target_extruder} TARGET={start_temp}
        TEMPERATURE_WAIT SENSOR={target_extruder} MAXIMUM={start_temp + 0.5}
        M117 Soaking at {start_temp|int}C (3s)...
        G4 P3000
    {% endif %}

    # ----------------------------------------------------------------------
    # 5. Initialize benchmark state & arm live timer
    # ----------------------------------------------------------------------
    SET_GCODE_VARIABLE MACRO=_TOOL_HEATUP_VARS VARIABLE=tool VALUE={target_tool}
    SET_GCODE_VARIABLE MACRO=_TOOL_HEATUP_VARS VARIABLE=extruder VALUE="'{target_extruder}'"
    SET_GCODE_VARIABLE MACRO=_TOOL_HEATUP_VARS VARIABLE=start_temp VALUE={start_temp}
    SET_GCODE_VARIABLE MACRO=_TOOL_HEATUP_VARS VARIABLE=target_temp VALUE={target_temp}
    SET_GCODE_VARIABLE MACRO=_TOOL_HEATUP_VARS VARIABLE=timeout VALUE={timeout}
    SET_GCODE_VARIABLE MACRO=_TOOL_HEATUP_VARS VARIABLE=elapsed VALUE=0.0
    SET_GCODE_VARIABLE MACRO=_TOOL_HEATUP_VARS VARIABLE=cooldown VALUE={cooldown}

    {% if printer["gcode_macro _SET_TOOL_LED"] is defined %}
        _SET_TOOL_LED T={target_tool} STATE=heating
    {% endif %}
    M117 Measuring T{target_tool}: {start_temp|int}C -> {target_temp|int}C...
    RESPOND TYPE=echo MSG="============================================="
    RESPOND TYPE=echo MSG=" [HEAT_BENCH] BAT DAU DO GIA NHIET T{target_tool} ({target_extruder})"
    RESPOND TYPE=echo MSG=" Moc nhiet : {start_temp}C -> {target_temp}C (ΔT = {target_temp - start_temp}C)"
    RESPOND TYPE=echo MSG=" Gioi han  : Timeout {timeout}s | Cooldown: {'Co' if cooldown == 1 else 'Khong'}"
    RESPOND TYPE=echo MSG="============================================="

    _TOOL_HEATUP_START_TIMER


[gcode_macro _TOOL_HEATUP_START_TIMER]
description: Internal benchmark continuation, checked after baseline temperature waits
gcode:
    {% set vars = printer["gcode_macro _TOOL_HEATUP_VARS"] %}
    {% set ps = printer["gcode_macro _PRINT_STATE"].state|string|lower if printer["gcode_macro _PRINT_STATE"] is defined else "idle" %}
    {% if vars.is_running|int != 1 %}
        {action_raise_error("Heat benchmark was stopped during preparation; timer was not restarted")}
    {% elif printer.print_stats.state|default("unknown")|lower not in ["standby", "complete", "cancelled", "error"] or printer.pause_resume.is_paused|default(true) or ps not in ["idle"] %}
        {action_raise_error("Heat benchmark continuation refused: print now owns the heater; use STOP_TOOL_HEATUP")}
    {% endif %}
    SET_HEATER_TEMPERATURE HEATER={vars.extruder} TARGET={vars.target_temp}
    UPDATE_DELAYED_GCODE ID=_TOOL_HEATUP_TIMER DURATION=0.5


############################################################################
# _TOOL_HEATUP_TIMER - High-frequency delayed_gcode reactor ticker
############################################################################

[delayed_gcode _TOOL_HEATUP_TIMER]
gcode:
    {% set vars = printer["gcode_macro _TOOL_HEATUP_VARS"] %}
    {% set ps = printer["gcode_macro _PRINT_STATE"].state|string|lower if printer["gcode_macro _PRINT_STATE"] is defined else "idle" %}
    {% set print_active = printer.print_stats.state|default("unknown")|lower not in ["standby", "complete", "cancelled", "error"] or printer.pause_resume.is_paused|default(true) or ps not in ["idle"] %}
    {% if vars.is_running == 1 and (print_active or printer[vars.extruder].target|float != vars.target_temp|float) %}
        # Another operation owns heat now. Cancel only our callback/state.
        SET_GCODE_VARIABLE MACRO=_TOOL_HEATUP_VARS VARIABLE=is_running VALUE=0
        UPDATE_DELAYED_GCODE ID=_TOOL_HEATUP_TIMER DURATION=0
        RESPOND TYPE=echo MSG="[HEAT_BENCH] Ownership changed; benchmark canceled without changing the heater."
    {% elif vars.is_running == 1 %}
        {% set cur_elapsed = vars.elapsed + vars.tick %}
        {% set ext = vars.extruder %}
        {% set t = vars.tool %}
        {% set cur_temp = printer[ext].temperature %}
        {% set start_t = vars.start_temp %}
        {% set target_t = vars.target_temp %}
        {% set timeout = vars.timeout %}

        SET_GCODE_VARIABLE MACRO=_TOOL_HEATUP_VARS VARIABLE=elapsed VALUE={cur_elapsed}

        # Case A: Safety Timeout
        {% if cur_elapsed >= timeout %}
            SET_GCODE_VARIABLE MACRO=_TOOL_HEATUP_VARS VARIABLE=is_running VALUE=0
            UPDATE_DELAYED_GCODE ID=_TOOL_HEATUP_TIMER DURATION=0
            SET_HEATER_TEMPERATURE HEATER={ext} TARGET=0
            {% if printer["gcode_macro _SET_TOOL_LED"] is defined %}
                _SET_TOOL_LED T={t} STATE=ready
            {% endif %}
            RESPOND TYPE=error MSG="[HEAT_BENCH] TIMEOUT: T{t} khong dat {target_t}C trong {timeout}s (Nhiet do hien tai: {cur_temp|round(1)}C)"
            M117 Heat bench TIMEOUT!

        # Case B: Target Temperature Reached!
        {% elif cur_temp >= target_t %}
            SET_GCODE_VARIABLE MACRO=_TOOL_HEATUP_VARS VARIABLE=is_running VALUE=0
            UPDATE_DELAYED_GCODE ID=_TOOL_HEATUP_TIMER DURATION=0

            {% if vars.cooldown == 1 %}
                SET_HEATER_TEMPERATURE HEATER={ext} TARGET=0
            {% endif %}
            {% if printer["gcode_macro _SET_TOOL_LED"] is defined %}
                _SET_TOOL_LED T={t} STATE=ready
            {% endif %}

            {% set delta_t = target_t - start_t %}
            {% set rate = (delta_t / cur_elapsed)|round(2) %}

            RESPOND TYPE=echo MSG="============================================="
            RESPOND TYPE=echo MSG=" [HEAT_BENCH] HOAN THANH DO GIA NHIET T{t}"
            RESPOND TYPE=echo MSG="---------------------------------------------"
            RESPOND TYPE=echo MSG=" Extruder         : {ext}"
            RESPOND TYPE=echo MSG=" Nhiet do bat dau  : {start_t} C"
            RESPOND TYPE=echo MSG=" Nhiet do muc tieu : {target_t} C"
            RESPOND TYPE=echo MSG=" Do tang nhiet (ΔT): {delta_t} C"
            RESPOND TYPE=echo MSG=" Thoi gian dat    : {cur_elapsed|round(1)} giay"
            RESPOND TYPE=echo MSG=" Toc do gia nhiet  : {rate} C/giay"
            RESPOND TYPE=echo MSG="============================================="
            M117 T{t}: {start_t|int}C->{target_t|int}C in {cur_elapsed|round(1)}s ({rate}C/s)

        # Case C: Still heating; reschedule next tick
        {% else %}
            # Periodic status broadcast every ~2.5 seconds
            {% if ((cur_elapsed * 10)|int % 25) == 0 %}
                M117 T{t}: {cur_temp|round(1)}C/{target_t|int}C ({cur_elapsed|round(1)}s)
                RESPOND TYPE=echo MSG="[HEAT_BENCH] T{t}: {cur_temp|round(1)}C / {target_t}C (Da troi qua: {cur_elapsed|round(1)}s)"
            {% endif %}
            UPDATE_DELAYED_GCODE ID=_TOOL_HEATUP_TIMER DURATION={vars.tick}
        {% endif %}
    {% endif %}


############################################################################
# STOP_TOOL_HEATUP - Abort; turn off its heater only when no print owns it
############################################################################

[gcode_macro STOP_TOOL_HEATUP]
description: Abort the running heating benchmark and shut off heater
gcode:
    {% set vars = printer["gcode_macro _TOOL_HEATUP_VARS"] %}
    {% set ps = printer["gcode_macro _PRINT_STATE"].state|string|lower if printer["gcode_macro _PRINT_STATE"] is defined else "idle" %}
    {% set print_active = printer.print_stats.state|default("unknown")|lower not in ["standby", "complete", "cancelled", "error"] or printer.pause_resume.is_paused|default(true) or ps not in ["idle"] %}
    {% if vars.is_running == 1 %}
        SET_GCODE_VARIABLE MACRO=_TOOL_HEATUP_VARS VARIABLE=is_running VALUE=0
        UPDATE_DELAYED_GCODE ID=_TOOL_HEATUP_TIMER DURATION=0
        {% if not print_active %}
            SET_HEATER_TEMPERATURE HEATER={vars.extruder} TARGET=0
            {% if printer["gcode_macro _SET_TOOL_LED"] is defined %}
                _SET_TOOL_LED T={vars.tool} STATE=ready
            {% endif %}
        {% endif %}
        RESPOND TYPE=echo MSG="[HEAT_BENCH] Da dung tien trinh do gia nhiet cho T{vars.tool} theo yeu cau."
        M117 Heat bench ABORTED
    {% else %}
        RESPOND TYPE=echo MSG="[HEAT_BENCH] Khong co tien trinh do gia nhiet nao dang chay."
    {% endif %}


############################################################################
# BENCH_TOOL_TEMP - Convenient alias for MEASURE_TOOL_HEATUP
#
# HOW TO CALL:
#   BENCH_TOOL_TEMP
#   BENCH_TOOL_TEMP TOOL=0 START_TEMP=150 TARGET_TEMP=220
#   BENCH_TOOL_TEMP TOOL=3 START=160 TARGET=230
############################################################################

[gcode_macro BENCH_TOOL_TEMP]
description: Convenient alias for MEASURE_TOOL_HEATUP
gcode:
    MEASURE_TOOL_HEATUP {rawparams}
