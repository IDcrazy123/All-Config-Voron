# Individual sharing: attended movement diagnostics, not a hardware tuning profile.
# Include once: [include test-speed.cfg]. Public: TEST_SPEED, TEST_Z_SPEED.
# Requires print_stats ([virtual_sdcard]), [pause_resume], [respond], gcode_move,
# Klipper toolhead runtime minimum_cruise_ratio/max_velocity/max_accel status.
# Existing QGL is checked when installed. Home/level beforehand; zero offsets.
# Clear bed, tool docks and all test routes first; bounds do not prove clearance.
# Call parameters own test changes; native [printer] retains configured caps.
# Runtime limits restore on NORMAL completion. An interrupt/error may skip the
# restore: inspect SET_VELOCITY_LIMIT before continuing. No physical test is run
# by including this file. Existing crash/homing policy remains in effect.

############################################################################
# TEST_SPEED - Andrew Ellis Print Tuning Guide (Adapted for StealthChanger)
# Sharing: BOUND/SMALLPATTERNSIZE control XY patterns; test on an empty bed.
# Home/QGL first and clear the bed. Crash detection follows the installed
# homing/detector policy; this file does not explicitly disable it.
# Procedure: Home -> ReadPositionFromMCU -> MovesToolhead@Vel&Accel -> Home -> ReadPositionFromMCU
# Default test height is Z=BOUND+10=30 mm; verify clearance on your machine.
############################################################################

[gcode_macro TEST_SPEED]
description: Test max velocity and acceleration parameters without skipping steps
gcode:
    # Call parameters; defaults remain owned by the native [printer] section.
    {% set speed            = params.SPEED|default(printer.configfile.settings.printer.max_velocity)|int %}
    {% set accel            = params.ACCEL|default(printer.configfile.settings.printer.max_accel)|int %}
    {% set iterations       = params.ITERATIONS|default(5)|int %}
    {% set min_cruise_ratio = params.MIN_CRUISE_RATIO|default(0.5)|float %}
    {% set bound            = params.BOUND|default(20)|int %}
    {% set smallpatternsize = params.SMALLPATTERNSIZE|default(20)|int %}

    # Render-time preflight: do not home or level from a stale status snapshot.
    {% if printer.print_stats is not defined or printer.pause_resume is not defined %}
        { action_raise_error("Motion test requires print_stats and pause_resume") }
    {% endif %}
    {% set state = printer.print_stats.state|default('unknown')|lower %}
    {% if state not in ['standby', 'complete', 'cancelled', 'error'] or printer.pause_resume.is_paused|default(true) %}
        { action_raise_error("Motion test requires an idle, unpaused printer") }
    {% endif %}
    {% if printer["gcode_macro _PRINT_STATE"] is defined and printer["gcode_macro _PRINT_STATE"].state != 'idle' %}
        { action_raise_error("Motion test blocked by print preparation") }
    {% endif %}
    {% if printer["gcode_macro _DRYER_STATUS"] is defined and printer["gcode_macro _DRYER_STATUS"].is_drying|int == 1 %}
        { action_raise_error("Stop the dryer before motion testing") }
    {% endif %}
    {% if printer["gcode_macro _TOOL_HEATUP_VARS"] is defined and printer["gcode_macro _TOOL_HEATUP_VARS"].is_running|int == 1 %}
        { action_raise_error("Stop the benchmark before motion testing") }
    {% endif %}
    {% if printer.toolhead.homed_axes != 'xyz' %}
        { action_raise_error("Home XYZ before motion testing") }
    {% endif %}
    {% if printer.quad_gantry_level is defined and not printer.quad_gantry_level.applied %}
        { action_raise_error("Run QUAD_GANTRY_LEVEL before motion testing") }
    {% endif %}
    {% set origin = printer.gcode_move.homing_origin %}
    {% if origin.x|float != 0 or origin.y|float != 0 or origin.z|float != 0 %}
        { action_raise_error("Motion test requires zero G-code offsets") }
    {% endif %}
    {% if printer.toolhead.minimum_cruise_ratio is not defined %}
        { action_raise_error("Motion test requires Klipper with minimum_cruise_ratio runtime status") }
    {% endif %}
    {% set old_speed = printer.toolhead.max_velocity|float %}
    {% set old_accel = printer.toolhead.max_accel|float %}
    {% set old_cruise = printer.toolhead.minimum_cruise_ratio|float %}
    {% if speed <= 0 or accel <= 0 or iterations < 1 %}
        { action_raise_error("SPEED, ACCEL and ITERATIONS must be positive") }
    {% endif %}
    {% if speed > printer.configfile.settings.printer.max_velocity|float or accel > printer.configfile.settings.printer.max_accel|float %}
        { action_raise_error("XY test cannot exceed configured velocity/acceleration limits") }
    {% endif %}
    {% if bound < 1 or smallpatternsize <= 0 or min_cruise_ratio < 0 or min_cruise_ratio > 1 %}
        { action_raise_error("Invalid BOUND, SMALLPATTERNSIZE or MIN_CRUISE_RATIO") }
    {% endif %}

    # Large pattern boundary limits
    {% set x_min = [printer.toolhead.axis_minimum.x, 0]|max + bound %}
    {% set x_max = printer.toolhead.axis_maximum.x - bound %}
    {% set y_min = [printer.toolhead.axis_minimum.y, 0]|max + bound %}
    {% set y_max = printer.toolhead.axis_maximum.y - bound %}

    # Small pattern at center
    {% set x_center = (printer.toolhead.axis_minimum.x|float + printer.toolhead.axis_maximum.x|float) / 2 %}
    {% set y_center = (printer.toolhead.axis_minimum.y|float + printer.toolhead.axis_maximum.y|float) / 2 %}
    {% set x_center_min = x_center - (smallpatternsize / 2) %}
    {% set x_center_max = x_center + (smallpatternsize / 2) %}
    {% set y_center_min = y_center - (smallpatternsize / 2) %}
    {% set y_center_max = y_center + (smallpatternsize / 2) %}

    {% if x_min >= x_max or y_min >= y_max or x_center_min < x_min or x_center_max > x_max or y_center_min < y_min or y_center_max > y_max or bound + 10 > printer.toolhead.axis_maximum.z %}
        { action_raise_error("XY pattern does not fit this machine travel") }
    {% endif %}

    SAVE_GCODE_STATE NAME=TEST_SPEED
    { action_respond_info("TEST_SPEED: Starting %d iterations at Speed=%d mm/s, Accel=%d mm/s^2" % (iterations, speed, accel)) }

    M400

    # Read reference microsteps at physical endstops
    G90
    G1 X{printer.toolhead.axis_maximum.x - 50} Y{printer.toolhead.axis_maximum.y - 50} F1800
    M400
    G28 X Y
    G0 X{printer.toolhead.axis_maximum.x - 1} Y{printer.toolhead.axis_maximum.y - 1} F1800
    G4 P1000
    GET_POSITION

    # Test height follows BOUND+10; operator must verify physical clearance.
    G0 X{x_min} Y{y_min} Z{bound + 10} F{speed * 60}

    # Set new test velocity and acceleration limits
    SET_VELOCITY_LIMIT VELOCITY={speed} ACCEL={accel} MINIMUM_CRUISE_RATIO={min_cruise_ratio}

    {% for i in range(iterations) %}
        # Large pattern diagonals
        G0 X{x_min} Y{y_min} F{speed * 60}
        G0 X{x_max} Y{y_max} F{speed * 60}
        G0 X{x_min} Y{y_min} F{speed * 60}
        G0 X{x_max} Y{y_min} F{speed * 60}
        G0 X{x_min} Y{y_max} F{speed * 60}
        G0 X{x_max} Y{y_min} F{speed * 60}

        # Large pattern box
        G0 X{x_min} Y{y_min} F{speed * 60}
        G0 X{x_min} Y{y_max} F{speed * 60}
        G0 X{x_max} Y{y_max} F{speed * 60}
        G0 X{x_max} Y{y_min} F{speed * 60}

        # Small pattern diagonals
        G0 X{x_center_min} Y{y_center_min} F{speed * 60}
        G0 X{x_center_max} Y{y_center_max} F{speed * 60}
        G0 X{x_center_min} Y{y_center_min} F{speed * 60}
        G0 X{x_center_max} Y{y_center_min} F{speed * 60}
        G0 X{x_center_min} Y{y_center_max} F{speed * 60}
        G0 X{x_center_max} Y{y_center_min} F{speed * 60}

        # Small pattern box
        G0 X{x_center_min} Y{y_center_min} F{speed * 60}
        G0 X{x_center_min} Y{y_center_max} F{speed * 60}
        G0 X{x_center_max} Y{y_center_max} F{speed * 60}
        G0 X{x_center_max} Y{y_center_min} F{speed * 60}
    {% endfor %}

    # Restore the runtime limits present at entry, including temporary overrides.
    SET_VELOCITY_LIMIT VELOCITY={old_speed} ACCEL={old_accel} MINIMUM_CRUISE_RATIO={old_cruise}

    # Re-home and get post-test position for microstep comparison
    M400
    G28 X Y
    G0 X{printer.toolhead.axis_maximum.x - 1} Y{printer.toolhead.axis_maximum.y - 1} F1800
    G4 P1000
    GET_POSITION

    RESTORE_GCODE_STATE NAME=TEST_SPEED


############################################################################
# TEST_Z_SPEED - Attended Z motion check, constrained by native max_z limits.
# Prepare homing/QGL first. SPEED/ACCEL may be lowered per call, but cannot
# exceed configured limits. Z_MAX defaults to 320 and is capped 25 mm below
# travel maximum; check dock/tool clearance before choosing another value.
############################################################################

[gcode_macro TEST_Z_SPEED]
description: Test max Z velocity and acceleration parameters without skipping steps on 4-motor flying gantry
gcode:
    # Call parameters; defaults remain owned by the native [printer] section.
    {% set speed      = params.SPEED|default(printer.configfile.settings.printer.max_z_velocity)|float %}
    {% set accel      = params.ACCEL|default(printer.configfile.settings.printer.max_z_accel)|float %}
    {% set iterations = params.ITERATIONS|default(5)|int %}
    {% set z_min      = params.Z_MIN|default(10.0)|float %}
    {% set z_max_limit = printer.toolhead.axis_maximum.z - 25.0 %}
    {% set z_max      = [params.Z_MAX|default(320.0)|float, z_max_limit]|min %}
    {% set x_center   = (printer.toolhead.axis_minimum.x|float + printer.toolhead.axis_maximum.x|float) / 2 %}
    {% set y_center   = (printer.toolhead.axis_minimum.y|float + printer.toolhead.axis_maximum.y|float) / 2 %}

    # Render-time preflight: do not home or level from a stale status snapshot.
    {% if printer.print_stats is not defined or printer.pause_resume is not defined %}
        { action_raise_error("Motion test requires print_stats and pause_resume") }
    {% endif %}
    {% set state = printer.print_stats.state|default('unknown')|lower %}
    {% if state not in ['standby', 'complete', 'cancelled', 'error'] or printer.pause_resume.is_paused|default(true) %}
        { action_raise_error("Motion test requires an idle, unpaused printer") }
    {% endif %}
    {% if printer["gcode_macro _PRINT_STATE"] is defined and printer["gcode_macro _PRINT_STATE"].state != 'idle' %}
        { action_raise_error("Motion test blocked by print preparation") }
    {% endif %}
    {% if printer["gcode_macro _DRYER_STATUS"] is defined and printer["gcode_macro _DRYER_STATUS"].is_drying|int == 1 %}
        { action_raise_error("Stop the dryer before motion testing") }
    {% endif %}
    {% if printer["gcode_macro _TOOL_HEATUP_VARS"] is defined and printer["gcode_macro _TOOL_HEATUP_VARS"].is_running|int == 1 %}
        { action_raise_error("Stop the benchmark before motion testing") }
    {% endif %}
    {% if printer.toolhead.homed_axes != 'xyz' %}
        { action_raise_error("Home XYZ before motion testing") }
    {% endif %}
    {% if printer.quad_gantry_level is defined and not printer.quad_gantry_level.applied %}
        { action_raise_error("Run QUAD_GANTRY_LEVEL before motion testing") }
    {% endif %}
    {% set origin = printer.gcode_move.homing_origin %}
    {% if origin.x|float != 0 or origin.y|float != 0 or origin.z|float != 0 %}
        { action_raise_error("Motion test requires zero G-code offsets") }
    {% endif %}
    {% if printer.toolhead.minimum_cruise_ratio is not defined %}
        { action_raise_error("Motion test requires Klipper with minimum_cruise_ratio runtime status") }
    {% endif %}
    {% set old_speed = printer.toolhead.max_velocity|float %}
    {% set old_accel = printer.toolhead.max_accel|float %}
    {% set old_cruise = printer.toolhead.minimum_cruise_ratio|float %}
    {% if speed <= 0 or accel <= 0 or iterations < 1 %}
        { action_raise_error("SPEED, ACCEL and ITERATIONS must be positive") }
    {% endif %}
    {% if speed > printer.configfile.settings.printer.max_z_velocity|float or speed > printer.configfile.settings.printer.max_velocity|float or accel > printer.configfile.settings.printer.max_z_accel|float or accel > printer.configfile.settings.printer.max_accel|float %}
        { action_raise_error("Z test cannot exceed configured velocity/acceleration limits") }
    {% endif %}
    {% if z_min < [0, printer.toolhead.axis_minimum.z|float]|max or z_max <= z_min %}
        { action_raise_error("Invalid Z_MIN/Z_MAX for this machine travel") }
    {% endif %}

    SAVE_GCODE_STATE NAME=TEST_Z_SPEED
    { action_respond_info("TEST_Z_SPEED: Starting %d iterations between Z=%.1f and Z=%.1f at Z_Speed=%.1f mm/s, Z_Accel=%.1f mm/s^2" % (iterations, z_min, z_max, speed, accel)) }

    M400

    # Move to center of bed at safe starting height Z_MIN
    G90
    G0 X{x_center} Y{y_center} Z{z_min} F12000
    M400
    G4 P1000
    { action_respond_info("TEST_Z_SPEED: Baseline reference microsteps before test:") }
    GET_POSITION

    # Pure Z cycles use supported global limits; native max_z limits still apply.
    SET_VELOCITY_LIMIT VELOCITY={speed} ACCEL={accel}

    # Execute vertical cycle loop
    {% for i in range(iterations) %}
        G0 Z{z_max} F{speed * 60}
        G0 Z{z_min} F{speed * 60}
    {% endfor %}

    # Restore the runtime limits present at entry.
    SET_VELOCITY_LIMIT VELOCITY={old_speed} ACCEL={old_accel} MINIMUM_CRUISE_RATIO={old_cruise}

    # Final position check
    M400
    G4 P1000
    { action_respond_info("TEST_Z_SPEED: Post-test microsteps (compare stepper_z..z3 with baseline):") }
    GET_POSITION

    RESTORE_GCODE_STATE NAME=TEST_Z_SPEED
