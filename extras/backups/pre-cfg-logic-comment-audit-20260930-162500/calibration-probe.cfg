# CALIBRATION-PROBE.CFG - Cartographer bed probing and tool-offset workflow
#
# Cartographer is fixed to the shuttle and remains the production Z-home/mesh
# probe. Axiscope owns camera-assisted XY measurement and uses the removable
# PF2 switch only for coarse relative Z. Final Z is verified by first layers.

#####################################################################
# Cartographer V3 - measured production geometry
#####################################################################

[cartographer]
mcu: cartographer
x_offset: 0                # Coil X offset relative to the nozzle.
y_offset: 35               # Coil Y offset relative to the nozzle.
verbose: no

#####################################################################
# Bed mesh - coordinates are probe coordinates, not nozzle coordinates
#####################################################################

[bed_mesh]
zero_reference_position: 174, 168
speed: 600
horizontal_move_z: 3
mesh_min: 20, 45
mesh_max: 320, 325
probe_count: 55, 55
adaptive_margin: 10
mesh_pps: 0,0

#####################################################################
# Cartographer onboard ADXL345 and saved axis-twist model
#####################################################################

[adxl345]
cs_pin: cartographer:PA3
spi_bus: spi1

[axis_twist_compensation]
# Klipper stores measured z_compensations in printer.cfg SAVE_CONFIG.

#####################################################################
# Calibration backend status and read-only offset report
#####################################################################

[gcode_macro CALIBRATION_STATUS]
description: Report the active tool-offset calibration backend
gcode:
  {% set switch = printer["gcode_macro _CALIBRATION_SWITCH"] %}
  RESPOND MSG="Calibration ownership: Axiscope camera = XY; PF2 switch = coarse relative Z; first-layer print = final Z"
  RESPOND MSG="PF2 switch: X{switch.x} Y{switch.y}; observed contact range Z0-2; Axiscope starts at Z{switch.probe_z}"
  RESPOND MSG="Cartographer remains responsible only for Z home/Touch and bed mesh"
  RESPOND MSG="Axiscope automatic config writes are disabled; review every result before changing saved offsets"
  RESPOND MSG="Remove the center holder before G28, QGL, Cartographer Touch, mesh, or printing"
  {% if printer.axiscope is defined %}
    RESPOND MSG="Axiscope Klipper backend active; use QUERY_ENDSTOPS to verify the switch before an attended coarse-Z run"
  {% else %}
    RESPOND TYPE=error MSG="Axiscope status object is unavailable"
  {% endif %}

[gcode_macro CHECK_OFFSETS]
description: Report XYZ offsets for every configured tool
gcode:
  _CHECK_OFFSETS

[gcode_macro _CHECK_OFFSETS]
description: Report XYZ offsets for every configured tool
gcode:
  RESPOND MSG="=== FIVE-TOOL XYZ OFFSETS ==="
  {% for tname in printer.toolchanger.tool_names %}
    {% set tool = printer[tname] %}
    RESPOND MSG="{tname}: X={tool.gcode_x_offset|float|round(4)} Y={tool.gcode_y_offset|float|round(4)} Z={tool.gcode_z_offset|float|round(4)}"
  {% endfor %}

[gcode_macro CALIBRATE_NOZZLE_PROBE_OFFSET]
description: Disabled legacy tool-probe command
gcode:
  {action_raise_error("No tool_probe_endstop is configured; Cartographer is fixed to the shuttle.")}

#####################################################################
# Axiscope - camera XY plus attended coarse relative-Z measurement
# Pin: PF2 on BTT Manta M8P V2.0
#
# Do not add [tools_calibrate]: it conflicts with Axiscope's probe_multi_axis.
# config_file_path is intentionally omitted so Axiscope cannot overwrite
# production tool offsets. Transfer reviewed XY results manually; treat switch
# Z results as preliminary and finalize each tool with a first-layer test.
#####################################################################

[axiscope]
pin: ^PF2
zswitch_x_pos: 80.0
zswitch_y_pos: -8.0
# Axiscope moves to zswitch_z_pos + lift_z before probing downward. The values
# below start at Z3, 1 mm above the upper edge of the observed Z0-2 contact range.
zswitch_z_pos: 2.0
lift_z: 1.0
move_speed: 60
z_move_speed: 4
samples: 5
start_gcode:
  BED_MESH_CLEAR
  STOP_CRASH_DETECTION
before_pickup_gcode:
  _CALIBRATE_SAFE_TRANSIT
after_pickup_gcode:
  M109 S150
finish_gcode:
  _CALIBRATE_SAFE_TRANSIT
  T0
  TURN_OFF_HEATERS
  START_CRASH_DETECTION
  RESPOND MSG="Coarse switch Z complete. Do not save it as final Z; verify every tool with a first-layer test."

[gcode_macro _CALIBRATE_SAFE_TRANSIT]
description: Lift vertically to the calibration-switch clearance before XY travel or tool changes
gcode:
  {% set switch = printer["gcode_macro _CALIBRATION_SWITCH"] %}
  {% if switch.z|float <= 0 or "xyz" not in printer.toolhead.homed_axes %}
    {action_raise_error("A positive switch transit height and homed XYZ are required for safe travel.")}
  {% endif %}
  # Evaluate the current Z when called, including after a probe or tool change.
  {% set travel_z = [printer.gcode_move.gcode_position.z|float, switch.z|float]|max %}
  G90
  G0 Z{travel_z} F2400

[gcode_macro CALIBRATE_MOVE_OVER_PROBE]
description: Position safely over the removable bed-center calibration switch
gcode:
  {% set switch = printer["gcode_macro _CALIBRATION_SWITCH"] %}
  {% if switch.z|float <= 0 %}
    {action_raise_error("Set a positive safe transit height for the center switch holder.")}
  {% endif %}
  {% if "xyz" not in printer.toolhead.homed_axes %}
    {action_raise_error("Remove the center holder and home XYZ, then reinstall it before switch calibration.")}
  {% endif %}
  {% set travel_z = [printer.gcode_move.gcode_position.z|float, switch.z|float]|max %}
  BED_MESH_CLEAR
  G90
  G0 Z{travel_z} F2400
  G0 X{switch.x} Y{switch.y} F6000
  G0 Z{switch.z} F2400

[gcode_macro CALIBRATE_ALL_OFFSETS]
description: Disabled legacy XYZ calibration command
gcode:
  {action_raise_error("Legacy XYZ calibration is disabled. Use Axiscope for XY, CALIBRATE_COARSE_Z_OFFSETS for preliminary Z, then first-layer tests for final Z.")}

[gcode_macro CALIBRATE_COARSE_Z_OFFSETS]
description: Run the attended PF2 switch measurement for preliminary relative Z only
gcode:
  {% if "xyz" not in printer.toolhead.homed_axes %}
    {action_raise_error("Remove the switch holder, home XYZ, then reinstall it before coarse-Z calibration.")}
  {% endif %}
  {% if printer.toolchanger.status != "ready" %}
    {action_raise_error("Initialize the toolchanger and verify tool detection before calibration.")}
  {% endif %}
  RESPOND MSG="Verify QUERY_ENDSTOPS: Axiscope must be open when released and TRIGGERED when pressed. Keep E-stop ready."
  RESPOND MSG="Starting preliminary Z measurement at X80 Y-8 from Z3; final Z still requires first-layer tests."
  CALIBRATE_ALL_Z_OFFSETS

