# ============================================================================
# TOOL-CRASH.CFG - Active-tool loss detection and pause routing
# Purpose: Monitor the mounted tool's detection input and pause an affected print.
# Loading: Included after KTC tools; requires the installed tool_crash extension.
# Main commands: START_CRASH_DETECTION and STOP_CRASH_DETECTION.
# The handler uses compatible Mainsail pause/resume state and requests no XYZ park.
# Inspect the mounted tool before recovery; already accepted commands can finish first.
# Local setup: Watchdog interval/threshold and event filtering in [tool_crash].
# Detection pins belong to the tool definitions, rather than the PF2 calibration switch.
# Print lifecycle/tool-change hooks control when the watchdog is enabled.
# ============================================================================

# Individual sharing: plugin integration, not a stock-Klipper standalone feature.
# Include once: [include tool-crash.cfg] after existing KTC tools are configured.
# Requires installed tool_crash extension (source below), tool.detection_pin,
# print_stats, pause_resume and [respond]. No hardcoded number of tools here.
# Handler assumes Mainsail PAUSE rename_existing: PAUSE_BASE and RESUME variables
# last_extruder_temp/restore_idle_timeout. Adapt the handler in place for another
# pause implementation; it rejects missing prerequisites before output.
# KTC START/STOP_CRASH_DETECTION names must not be duplicated in your user files.
# Optional LED/retract helpers are detected. Crash handling makes no XYZ move;
# a receiver's CANCEL_PRINT can still park, so review that separate handler.

# TOOL-CRASH.CFG - Five-tool presence crash detection and safe pause routing
# Source: https://github.com/cekim-git/tool_crash
#
# Include this file after KTC-Easy has loaded every [tool] section. The plugin
# reads each tool's detection_pin; Cartographer and the PF2 calibration switch
# are not crash inputs.

[tool_crash]
# Poll the active-tool state every 0.5 s and require two consecutive failures.
watchdog_interval: 0.5
watchdog_threshold: 2

# Ignore sensor edges produced by probing/homing and suppress an immediate
# post-home report for one second. Upstream treats "all" only as an alias for
# "probing", so it is not a global disable switch.
ignore_events: probing
home_timeblock: 1.0

# Upstream invokes a Klipper shutdown when crash_gcode is absent. This machine
# instead queues a resumable PAUSE handler. The plugin disables its own detector
# before calling this handler, so the same crash is not reported repeatedly.
crash_gcode:
  _TOOL_CRASH_SAFE_PAUSE
crash_mintime: 0.1

# KTC's readonly macros call START/STOP_CRASH_DETECTION. These user-owned
# definitions are loaded later and route those names to the installed detector.
# The legacy tool_probe_endstop branch remains as a compatibility fallback.
[gcode_macro STOP_CRASH_DETECTION]
description: Disable the installed tool-presence crash detector
gcode:
  {% if "tool_crash" in printer.configfile.config %}
    STOP_TOOL_CRASH_DETECTION
  {% elif printer["tool_probe_endstop"] is defined %}
    STOP_TOOL_PROBE_CRASH_DETECTION
  {% endif %}

[gcode_macro _TOOL_RECOVERY]
description: Latched attachment uncertainty; retained across cancel until confirmed
variable_required: 0
variable_tool: -1
gcode:

[gcode_macro CONFIRM_TOOL_RECOVERY]
description: Confirm inspected/resecured tool or empty shuttle without moving XYZ
gcode:
  {% set requested = params.T|default(-2)|int %}
  {% if params.CONFIRM|default(0)|int != 1 or (requested not in printer.toolchanger.tool_numbers and requested not in [-2, -1]) %}
    {action_raise_error("Secure the original tool, then run CONFIRM_TOOL_RECOVERY CONFIRM=1 while attended")}
  {% endif %}
  # Initialize first; the helper renders afterward and sees the fresh sensor state.
  INITIALIZE_TOOLCHANGER
  _TOOL_RECOVERY_AFTER_INIT T={requested}

[gcode_macro _TOOL_RECOVERY_AFTER_INIT]
description: Verify the newly initialized attachment state before clearing recovery
gcode:
  {% set active = printer.toolchanger.tool_number|default(-1)|int %}
  {% set detected = printer.toolchanger.detected_tool_number|default(-1)|int %}
  {% set requested = params.T|default(-2)|int %}
  {% set expected = active if requested == -2 else requested %}
  {% if printer.toolchanger.status != "ready" or expected != active or expected != detected %}
    {action_raise_error("Tool recovery failed: initialized, active and detected tools disagree; inspect the dock and sensor")}
  {% endif %}
  {% if expected >= 0 %}
    VERIFY_TOOL_DETECTED T={expected}
  {% endif %}
  _TOOL_RECOVERY_CONFIRMED T={expected}

[gcode_macro _TOOL_RECOVERY_CONFIRMED]
description: Clear the recovery latch only after fresh attachment verification
gcode:
  {% set expected = params.T|default(-1)|int %}
  {% if printer.toolchanger.status != "ready" or printer.toolchanger.tool_number|int != expected or printer.toolchanger.detected_tool_number|default(-1)|int != expected %}
    {action_raise_error("Tool recovery confirmation failed; leave the printer paused")}
  {% endif %}
  SET_GCODE_VARIABLE MACRO=_TOOL_RECOVERY VARIABLE=required VALUE=0
  SET_GCODE_VARIABLE MACRO=_TOOL_RECOVERY VARIABLE=tool VALUE={expected}
  RESPOND MSG="Tool attachment confirmed; recovery latch cleared"

[gcode_macro RECOVER_TOOL]
description: Convenience shortcut to confirm tool recovery with one click
gcode:
  {% if params.T is defined %}
    CONFIRM_TOOL_RECOVERY CONFIRM=1 T={params.T|int}
  {% else %}
    CONFIRM_TOOL_RECOVERY CONFIRM=1
  {% endif %}

[gcode_macro START_CRASH_DETECTION]
description: Enable the installed tool-presence crash detector
gcode:
  {% if "tool_crash" in printer.configfile.config %}
    START_TOOL_CRASH_DETECTION
  {% elif printer["tool_probe_endstop"] is defined %}
    START_TOOL_PROBE_CRASH_DETECTION
  {% endif %}

# Safe crash response:
# - PAUSE_BASE preserves a resumable print state.
# - Only the normal Mainsail E retract is allowed.
# - No X/Y/Z park move is requested because a detached or skewed tool may make
#   any recovery travel unsafe.
# - Outside an active print, the handler reports the event without shutdown or
#   motion.
#
# The custom handler is queued behind motion already accepted by Klipper. This
# delay is an upstream limitation documented by tool_crash and cannot be removed
# while retaining a G-code pause response.
[gcode_macro _TOOL_CRASH_SAFE_PAUSE]
description: Pause after a tool crash without moving X, Y, or Z
gcode:
  {% set is_paused = printer.pause_resume.is_paused|default(false) %}
  {% set is_printing = printer.print_stats.state|default("")|lower == "printing" %}

  SET_GCODE_VARIABLE MACRO=_TOOL_RECOVERY VARIABLE=required VALUE=1
  SET_GCODE_VARIABLE MACRO=_TOOL_RECOVERY VARIABLE=tool VALUE={printer.toolchanger.tool_number|default(-1)|int}

  {% if is_paused %}
    M117 Tool crash - inspect printer
    RESPOND TYPE=error MSG="Tool crash detected while already paused; inspect and secure the tool before RESUME or CANCEL_PRINT"
  {% elif is_printing %}
    {% if printer["gcode_macro RESUME"] is not defined or printer["gcode_macro RESUME"].last_extruder_temp is not defined or printer["gcode_macro RESUME"].restore_idle_timeout is not defined or printer.configfile.config.get("gcode_macro PAUSE", {}).get("rename_existing", "")|upper != "PAUSE_BASE" %}
      { action_raise_error("Crash pause requires the Mainsail RESUME variables and PAUSE_BASE; adapt this handler to your pause implementation before use") }
    {% endif %}
    {% set client = printer["gcode_macro _CLIENT_VARIABLE"]|default({}) %}
    {% set idle_timeout = client.idle_timeout|default(0)|int %}
    {% set extruder = printer.toolhead.extruder|default("")|string %}
    {% set target = printer[extruder].target|float if extruder else 0.0 %}
    {% set restore = true if extruder else false %}

    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=last_extruder_temp VALUE="{{'restore': restore, 'temp': target}}"
    {% if idle_timeout > 0 %}
      SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=restore_idle_timeout VALUE={printer.configfile.settings.idle_timeout.timeout}
      SET_IDLE_TIMEOUT TIMEOUT={idle_timeout}
    {% endif %}

    PAUSE_BASE
    {% if printer["gcode_macro _PRINT_PAUSED"] is defined %}
      _PRINT_PAUSED
    {% endif %}
    {% if printer["gcode_macro _CLIENT_RETRACT"] is defined %}
      _CLIENT_RETRACT
    {% endif %}
    M117 Tool crash - inspect printer
    RESPOND TYPE=error MSG="Tool crash detected; print paused without XYZ parking. Inspect and secure the tool before RESUME or CANCEL_PRINT"
  {% else %}
    M117 Tool crash detected
    RESPOND TYPE=error MSG="Tool crash detected outside an active print; no shutdown or motion was requested"
  {% endif %}
