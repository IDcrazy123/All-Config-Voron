# Voron 2.4 350 mm / five-tool StealthChanger production entry point.
# Local modules own hardware and workflows; KTC owns tool pickup and docking.
# Cartographer owns Z home/mesh; Axiscope and attended first-layer tests own
# preliminary and final tool calibration respectively.
# Keep the machine-specific [printer] limits and generated SAVE_CONFIG block.
# Copy individual Printer-Setup modules when sharing a feature, not this file.

# Interface and KTC-managed toolchanger configuration.
[include mainsail.cfg]
[include toolchanger/readonly-configs/toolchanger-include.cfg]

# Calibration integration and installed hardware.
[include Printer-Setup/calibration-probe.cfg]
[include Printer-Setup/hardware.cfg]
[include Printer-Setup/fans-leds.cfg]
[include Printer-Setup/input-shaper.cfg]

# Print lifecycle and routine maintenance.
[include Printer-Setup/nozzle-clean.cfg]
[include Printer-Setup/prime-lines.cfg]
[include Printer-Setup/print-macros.cfg]
[include Printer-Setup/filament-dryer.cfg]

# Keep after KTC: these crash-detection macros override its default hooks.
[include Printer-Setup/tool-crash.cfg]

# One-off calibration and diagnostics. Enable the matching include before
# running generated Oxplow G-code, speed tests or heat benchmarks. RESTART
# while idle after changing these lines; routine prints do not use them.
# [include Printer-Setup/oxplow_runtime.cfg]
# [include Printer-Setup/test-speed.cfg]
# [include Printer-Setup/tool-temp-bench.cfg]

# Active motion limits; change only after attended mechanical verification.
[printer]
kinematics: corexy
max_velocity: 350
max_accel: 7000
max_z_velocity: 80
max_z_accel: 1000
square_corner_velocity: 5.0

