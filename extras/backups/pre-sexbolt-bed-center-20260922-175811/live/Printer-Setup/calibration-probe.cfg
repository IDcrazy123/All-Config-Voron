# CALIBRATION-PROBE.CFG - Cartographer bed probing and tool-offset workflow
#
# Cartographer is fixed to the shuttle and remains the production Z-home/mesh
# probe. The attended SexBolt trial uses the official KTC-Easy
# tools_calibrate backend on PF2 for relative XYZ tool-offset measurement.

#####################################################################
# Cartographer V3 - measured production geometry
#####################################################################

[cartographer]
mcu: cartographer
x_offset: 0                # Coil X offset relative to the nozzle.
y_offset: 35               # Coil Y offset relative to the nozzle.
verbose: no

#####################################################################
# Bed mesh - coordinates are probe coordinates, not nozzle coordinates
#####################################################################

[bed_mesh]
zero_reference_position: 174, 168
speed: 600
horizontal_move_z: 3
mesh_min: 20, 45
mesh_max: 320, 325
probe_count: 55, 55
adaptive_margin: 10
mesh_pps: 0,0

#####################################################################
# Cartographer onboard ADXL345 and saved axis-twist model
#####################################################################

[adxl345]
cs_pin: cartographer:PA3
spi_bus: spi1

[axis_twist_compensation]
# Klipper stores measured z_compensations in printer.cfg SAVE_CONFIG.

#####################################################################
# Calibration backend status and read-only offset report
#####################################################################

[gcode_macro CALIBRATION_STATUS]
description: Report the active tool-offset calibration backend
gcode:
  RESPOND MSG="Calibration backends: SexBolt tools_calibrate (PF2 relative tool XYZ); Cartographer (shuttle Z homing and bed mesh)"
  RESPOND MSG="SexBolt trial center: X80.0 Y-5.5; measured nozzle contact near Z12.0; safe approach Z18.0"
  {% if printer.tools_calibrate is defined %}
    RESPOND MSG="tools_calibrate active; run SEXBOLT_QUERY before any probing move"
  {% else %}
    RESPOND TYPE=error MSG="tools_calibrate status object is unavailable"
  {% endif %}

[gcode_macro CHECK_OFFSETS]
description: Report XYZ offsets for every configured tool
gcode:
  _CHECK_OFFSETS

[gcode_macro _CHECK_OFFSETS]
description: Report XYZ offsets for every configured tool
gcode:
  RESPOND MSG="=== FIVE-TOOL XYZ OFFSETS ==="
  {% for tname in printer.toolchanger.tool_names %}
    {% set tool = printer[tname] %}
    RESPOND MSG="{tname}: X={tool.gcode_x_offset|float|round(4)} Y={tool.gcode_y_offset|float|round(4)} Z={tool.gcode_z_offset|float|round(4)}"
  {% endfor %}

[gcode_macro CALIBRATE_NOZZLE_PROBE_OFFSET]
description: Disabled legacy tool-probe command
gcode:
  {action_raise_error("No tool_probe_endstop is configured; Cartographer is fixed to the shuttle.")}

#####################################################################
# SexBolt / SexBall - attended relative XYZ tool-offset trial
# Upstream: KTC-Easy tools_calibrate | Pin: PF2 on BTT Manta M8P V2.0
#
# Axiscope cannot coexist with [tools_calibrate] and is intentionally not
# configured during this trial. Keep the first run attended and use
# SEXBOLT_QUERY with the switch released and manually pressed before probing.
#####################################################################

[tools_calibrate]
pin: ^PF2
travel_speed: 20
# Y center is -5.5 and machine Y minimum is -10; 3.5 keeps the y+ start at
# Y-9.0 with 1 mm of travel margin. A spread of 7 would start at Y-12.5.
spread: 3.5
lower_z: 0.3
speed: 2
lift_speed: 4
final_lift_z: 6
sample_retract_dist: 2
samples_tolerance: 0.15
samples_tolerance_retries: 2
samples: 5
samples_result: median
probe: probe
# Leave at zero until TOOL_CALIBRATE_PROBE_OFFSET is commissioned separately.
trigger_to_bottom_z: 0.0

[gcode_macro SEXBOLT_QUERY]
description: Report the PF2 SexBolt switch state without moving any axis
gcode:
  TOOL_CALIBRATE_QUERY_PROBE

[gcode_macro CALIBRATE_MOVE_OVER_PROBE]
description: Move above the measured SexBolt center without touching it
gcode:
  {% if "xyz" not in printer.toolhead.homed_axes %}
    {action_raise_error("Home XYZ before moving over the SexBolt.")}
  {% endif %}
  BED_MESH_CLEAR
  G90
  G0 Z{printer["gcode_macro _CALIBRATION_SWITCH"].z} F2400
  G0 X{printer["gcode_macro _CALIBRATION_SWITCH"].x} Y{printer["gcode_macro _CALIBRATION_SWITCH"].y} F6000

[gcode_macro CALIBRATE_ALL_OFFSETS]
description: Attended KTC-Easy SexBolt XYZ calibration for all configured tools
gcode:
  {% if "xyz" not in printer.toolhead.homed_axes %}
    {action_raise_error("Home XYZ before starting SexBolt calibration.")}
  {% endif %}
  {% if printer.toolchanger.status != "ready" %}
    {action_raise_error("Initialize the toolchanger and verify tool detection before calibration.")}
  {% endif %}
  {% set tools = printer.toolchanger.tool_numbers %}
  {% set names = printer.toolchanger.tool_names %}
  RESPOND MSG="Starting attended SexBolt XYZ calibration at X80.0 Y-5.5 (contact near Z12.0)"
  SELECT_TOOL T={tools[0]} RESTORE_AXIS=XYZ
  STOP_CRASH_DETECTION
  CALIBRATE_MOVE_OVER_PROBE
  M104 S150
  TEMPERATURE_WAIT SENSOR='{printer.toolhead.extruder}' MINIMUM=150
  TOOL_LOCATE_SENSOR
  M104 S0
  {% for tool in tools[1:] %}
    SELECT_TOOL T={tool} RESTORE_AXIS=Z
    STOP_CRASH_DETECTION
    M104 S150 T{tool}
    CALIBRATE_MOVE_OVER_PROBE
    TEMPERATURE_WAIT SENSOR='{printer[names[loop.index]].extruder}' MINIMUM=150
    TOOL_CALIBRATE_TOOL_OFFSET
    _SAVE_TOOL_OFFSET T={tool}
    M104 S0
  {% endfor %}
  SELECT_TOOL T={tools[0]} RESTORE_AXIS=XZ
  START_CRASH_DETECTION
  TURN_OFF_HEATERS
  RESPOND MSG="SexBolt calibration complete; verify CHECK_OFFSETS before SAVE_CONFIG"
